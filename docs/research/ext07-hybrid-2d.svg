<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Exact two-dimensional hybrid path</title>
  <desc id="desc">A source state at minus one, zero flows with control one to the origin. The universal guard accepts it, and the identity reset places the same point in the target mode.</desc>
  <rect width="720" height="300" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" fill="#172033">
    <text x="30" y="36" font-size="20" font-weight="700">One exact 2D path: source → target</text>
    <text x="30" y="66" font-size="14">x_pre = x + u, y_pre = y; initial (-1,0), u = 1</text>
    <line x1="90" y1="210" x2="430" y2="210" stroke="#64748b" stroke-width="2"/>
    <line x1="260" y1="90" x2="260" y2="258" stroke="#64748b" stroke-width="2"/>
    <text x="438" y="216" font-size="14">x</text><text x="268" y="98" font-size="14">y</text>
    <line x1="136" y1="206" x2="260" y2="206" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
    <circle cx="136" cy="206" r="7" fill="#2563eb"/>
    <circle cx="260" cy="206" r="7" fill="#ea580c"/>
    <text x="98" y="188" font-size="14">source x₀ = (−1,0)</text>
    <text x="274" y="188" font-size="14">target x₁ = (0,0)</text>
    <text x="435" y="142" font-size="15" font-weight="700">guard: R²</text>
    <text x="435" y="168" font-size="15">reset: identity</text>
    <text x="435" y="194" font-size="15">terminal x = 0</text>
    <text x="435" y="220" font-size="13" fill="#475569">Illustration, not a benchmark</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#2563eb"/></marker></defs>
</svg>