<line x1="90" y1="72" x2="90" y2="512" class="axis"/><line x1="90" y1="512" x2="530" y2="512" class="axis"/>
<circle cx="90.0" cy="72.0" r="8" fill="#1769aa" stroke="#1769aa" stroke-width="3"><title>Strategy A: reach-back: u0=0, u1=1</title></circle><circle cx="530.0" cy="72.0" r="8" fill="#1769aa" stroke="#1769aa" stroke-width="3"><title>Strategy A: reach-back: u0=1, u1=1</title></circle><circle cx="90.0" cy="72.0" r="12" fill="none" stroke="#c23b22" stroke-width="3"><title>Strategy B: direct joint optimization: u0=0, u1=1</title></circle><circle cx="530.0" cy="72.0" r="12" fill="none" stroke="#c23b22" stroke-width="3"><title>Strategy B: direct joint optimization: u0=1, u1=1</title></circle><text x="310.0" y="562" text-anchor="middle">First-stage control u₀</text>
