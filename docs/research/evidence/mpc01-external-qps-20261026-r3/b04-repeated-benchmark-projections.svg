<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 670" role="img" aria-labelledby="title desc">
<title id="title">B04 repeated benchmark trajectories projected from four states into two planes</title>
<desc id="desc">Representative cold OSQP and HPIPM trajectories, selected from five repetitions by proximity to each backend median solve time, are overlaid with the exact saved reference witness. The left panel projects four-dimensional states onto oxidizer and fuel flows; the right projects them onto working stocks. The paths are representative individual attempts, not averaged trajectories or a historical B04 reconstruction. Binary64 solver residual checks are inconclusive.</desc>
