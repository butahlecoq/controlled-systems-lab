<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 610" role="img" aria-labelledby="title desc">
<title id="title">T-S01 selected optimal control histories</title>
<desc id="desc">The exact minimizer segment u0 plus u1 equals one inside the unit square, with saved selected control histories from Strategy A and Strategy B.</desc>
<style>text{font:14px sans-serif;fill:#263238}.grid{stroke:#d9e0e5;stroke-width:1}.optimal{stroke:#263238;stroke-width:3;stroke-dasharray:8 5}.axis{stroke:#263238;stroke-width:2}</style>
<rect width="660" height="610" fill="white"/>
<text x="330" y="32" text-anchor="middle" font-size="19" font-weight="bold">T-S01 two-stage integrator: control plane</text>
<line x1="75.0" y1="75" x2="75.0" y2="515" class="grid"/><line x1="75" y1="515.0" x2="515" y2="515.0" class="grid"/><text x="75.0" y="539" text-anchor="middle">0.0</text><text x="62" y="519.0" text-anchor="end">0.0</text><line x1="163.0" y1="75" x2="163.0" y2="515" class="grid"/><line x1="75" y1="427.0" x2="515" y2="427.0" class="grid"/><text x="163.0" y="539" text-anchor="middle">0.2</text><text x="62" y="431.0" text-anchor="end">0.2</text><line x1="251.0" y1="75" x2="251.0" y2="515" class="grid"/><line x1="75" y1="339.0" x2="515" y2="339.0" class="grid"/><text x="251.0" y="539" text-anchor="middle">0.4</text><text x="62" y="343.0" text-anchor="end">0.4</text><line x1="339.0" y1="75" x2="339.0" y2="515" class="grid"/><line x1="75" y1="251.0" x2="515" y2="251.0" class="grid"/><text x="339.0" y="539" text-anchor="middle">0.6</text><text x="62" y="255.0" text-anchor="end">0.6</text><line x1="427.0" y1="75" x2="427.0" y2="515" class="grid"/><line x1="75" y1="163.0" x2="515" y2="163.0" class="grid"/><text x="427.0" y="539" text-anchor="middle">0.8</text><text x="62" y="167.0" text-anchor="end">0.8</text><line x1="515.0" y1="75" x2="515.0" y2="515" class="grid"/><line x1="75" y1="75.0" x2="515" y2="75.0" class="grid"/><text x="515.0" y="539" text-anchor="middle">1.0</text><text x="62" y="79.0" text-anchor="end">1.0</text><line x1="75.0" y1="75.0" x2="515.0" y2="515.0" class="optimal"/>
<line x1="75" y1="75" x2="75" y2="515" class="axis"/><line x1="75" y1="515" x2="515" y2="515" class="axis"/>
<circle cx="75.0" cy="75.0" r="6" fill="#1769aa" stroke="white" stroke-width="2"><title>Strategy A: reach-back selected control history 1: u0=0, u1=1</title></circle><circle cx="515.0" cy="515.0" r="6" fill="#1769aa" stroke="white" stroke-width="2"><title>Strategy A: reach-back selected control history 2: u0=1, u1=0</title></circle><circle cx="75.0" cy="75.0" r="11" fill="none" stroke="#c23b22" stroke-width="3"><title>Strategy B: paired capture selected control history 1: u0=0, u1=1</title></circle><circle cx="515.0" cy="515.0" r="11" fill="none" stroke="#c23b22" stroke-width="3"><title>Strategy B: paired capture selected control history 2: u0=1, u1=0</title></circle>
<text x="295.0" y="567" text-anchor="middle">First-stage control u₀</text>
<text transform="translate(20 295.0) rotate(-90)" text-anchor="middle">Second-stage control u₁</text>
<text x="510" y="107" text-anchor="end">Exact optimal family: u₀ + u₁ = 1</text>
</svg>