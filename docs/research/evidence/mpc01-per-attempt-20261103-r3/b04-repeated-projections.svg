<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 670" role="img" aria-labelledby="title desc">
<title id="title">B04 solver trajectories projected into oxidizer and fuel planes</title>
<desc id="desc">Representative cold OSQP and HPIPM trajectories from a five-repetition resource-limited capture are overlaid with the exact saved reference witness. The left panel projects state coordinates one and two onto oxidizer flow and working stock; the right panel projects coordinates three and four onto fuel flow and working stock. This is not historical B04. Binary64 solver residual checks are inconclusive.</desc>
