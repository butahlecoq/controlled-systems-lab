<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" role="img" aria-labelledby="title desc">
  <title id="title">Stage-60 corrected-track error enclosure</title>
  <desc id="desc">An outward coordinate box for the nonlinear-minus-affine state error lies inside a Euclidean ball of radius 13.769874231197718.</desc>
  <rect width="560" height="390" fill="#fff"/>
  <text x="28" y="30" font-family="sans-serif" font-size="17" font-weight="700" fill="#172554">Stage 60: paired trajectory error enclosure</text>
  <text x="28" y="51" font-family="sans-serif" font-size="12" fill="#475569">All shared 60-stage controls in [-0.3, 0.3]; validated interval bound</text>
  <g transform="translate(220 205) scale(10 -10)">
    <circle r="13.769874231197718" fill="#dbeafe" fill-opacity=".45" stroke="#2563eb" stroke-width=".25" stroke-dasharray="1.2 .8"/>
    <rect x="-11.356423696906124" y="-7.540847700879224" width="22.300018256613525" height="15.328085796594031" fill="#fb923c" fill-opacity=".32" stroke="#c2410c" stroke-width=".3"/>
    <path d="M-13 0H13M0-13V13" stroke="#64748b" stroke-width=".12"/>
  </g>
  <g font-family="sans-serif" font-size="11" fill="#334155">
    <text x="390" y="102">Euclidean ball</text><text x="390" y="118">radius &lt; 13.76987424</text>
    <line x1="374" y1="112" x2="365" y2="126" stroke="#2563eb" stroke-width="2"/>
    <text x="390" y="159">Outward error box</text><text x="390" y="175">e1: [-11.3565, 10.9436]</text><text x="390" y="191">e2: [-7.5409, 7.7873]</text>
    <line x1="374" y1="166" x2="329" y2="144" stroke="#c2410c" stroke-width="2"/>
    <text x="28" y="360">e1 = nonlinear deviation − affine surrogate</text>
    <text x="28" y="378">The model, initial-coordinate mapping, and T0 grouping are explicit corrected-track assumptions.</text>
    <text x="444" y="211">e1</text><text x="224" y="66">e2</text>
  </g>
</svg>
