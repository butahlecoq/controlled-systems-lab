  <title id="title">Stage-60 corrected-track error enclosure</title>
  <desc id="desc">An outward coordinate box for the nonlinear-minus-affine state error lies inside a Euclidean ball of radius 13.76987423119771760397501497759765962256525224464014945654506809953679691341003279.</desc>
