 <ns0:title id="geometry-title">MPC-02 exact projection onto the lifted memory coordinates</ns0:title><ns0:desc id="geometry-description">lifted memory p1 = u0 (dimensionless); lifted memory p2 = u1 (dimensionless). Numeric ticks and major gridlines follow csl-report-quantitative-v1. Equal data scaling on both axes. The memory plane keeps p1=u0 and p2=u1 and omits the physical state coordinates. The stage-box optimum lies outside the slew strip; the red point is the unique analytic slew-constrained minimizer. Read the adjacent page for exact saved values and evidence limits.</ns0:desc><ns0:metadata>
