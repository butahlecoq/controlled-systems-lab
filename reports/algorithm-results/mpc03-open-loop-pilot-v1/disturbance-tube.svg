<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">Two stage open loop minimax disturbance histories</title>
  <desc id="desc">The four disturbance histories for the fixed control sequence one, one form four points in the plane of first and terminal state. All terminal states satisfy the lower safety bound of 1.5. The worst terminal cost is 2.25.</desc>
  <rect width="760" height="460" fill="#fff"/>
  <text x="380" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700">Fixed plan (u₀,u₁) = (1,1): four disturbance histories</text>
  <text x="380" y="55" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#444">2D state projection; w₀,w₁ ∈ {−0.125,+0.125}; terminal cost max x₂ = 2.25</text>
  <g stroke="#d8dee8" stroke-width="1">
    <path d="M100 360H650M100 300H650M100 240H650M100 180H650M100 120H650"/>
    <path d="M100 100V360M210 100V360M320 100V360M430 100V360M540 100V360M650 100V360"/>
  </g>
  <path d="M100 360H650M100 360V100" fill="none" stroke="#222" stroke-width="2"/>
  <g font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">
    <text x="100" y="380">0.75</text><text x="210" y="380">0.85</text><text x="320" y="380">0.95</text><text x="430" y="380">1.05</text><text x="540" y="380">1.15</text><text x="650" y="380">1.25</text>
    <text x="380" y="410" font-size="14">Intermediate state x₁</text>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#333" text-anchor="end">
    <text x="90" y="364">1.5</text><text x="90" y="304">1.75</text><text x="90" y="244">2.0</text><text x="90" y="184">2.25</text><text x="90" y="124">2.5</text>
  </g>
  <text x="28" y="230" transform="rotate(-90 28 230)" text-anchor="middle" font-family="sans-serif" font-size="14">Terminal state and cost x₂</text>
  <path d="M237.5 300L512.5 180L512.5 240L237.5 240Z" fill="#dce9f7" fill-opacity=".7" stroke="#50769e" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M100 360H650" stroke="#c23b32" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="645" y="350" text-anchor="end" font-family="sans-serif" font-size="12" fill="#a52c25">terminal safety x₂ ≥ 1.5</text>
  <g font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    <circle cx="237.5" cy="300" r="7" fill="#235789"/><text x="210" y="320" fill="#173e62">(−,−)</text>
    <circle cx="237.5" cy="240" r="7" fill="#2e8b57"/><text x="207" y="230" fill="#206440">(−,+)</text>
    <circle cx="512.5" cy="240" r="7" fill="#9467bd"/><text x="545" y="230" fill="#70469b">(+,−)</text>
    <circle cx="512.5" cy="180" r="8" fill="#d97706"/><text x="545" y="170" fill="#9b4e00">(+,+), worst</text>
  </g>
  <rect x="100" y="430" width="550" height="1" fill="#ccd2dc"/>
  <text x="380" y="450" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">The dashed polygon is the convex hull of the four authored history endpoints; the labelled points retain discrete history identity.</text>
</svg>
