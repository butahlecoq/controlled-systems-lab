<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" role="img" aria-labelledby="title desc">
<title id="title">Two-step scalar slew-feasible control histories</title>
<desc id="desc">The feasible polygon in coordinates u zero and u one under initial memory p zero equals one quarter, absolute bounds, and slew increments of plus or minus one quarter. The minimum terminal-state objective occurs at zero and minus one quarter.</desc>
<rect width="640" height="410" fill="#ffffff"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-family="sans-serif" font-weight="bold">Two-step control histories after the memory lift</text>
<polygon points="100,340 100,210 560,80 560,210" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
<line x1="100" y1="340" x2="560" y2="210" stroke="#475569" stroke-width="1.5" stroke-dasharray="7 5"/>
<line x1="100" y1="210" x2="560" y2="80" stroke="#475569" stroke-width="1.5" stroke-dasharray="7 5"/>
<line x1="100" y1="340" x2="560" y2="340" stroke="#111827" stroke-width="2"/>
<line x1="100" y1="340" x2="100" y2="72" stroke="#111827" stroke-width="2"/>
<line x1="100" y1="340" x2="560" y2="340" stroke="#111827" stroke-width="1"/>
<line x1="100" y1="340" x2="100" y2="80" stroke="#111827" stroke-width="1"/>
<text x="332" y="382" text-anchor="middle" font-size="15" font-family="sans-serif">u₀ (first control)</text>
<text x="32" y="212" text-anchor="middle" font-size="15" font-family="sans-serif" transform="rotate(-90 32 212)">u₁ (second control)</text>
<text x="93" y="361" text-anchor="end" font-size="12" font-family="sans-serif">0</text>
<text x="560" y="361" text-anchor="middle" font-size="12" font-family="sans-serif">1/2</text>
<text x="90" y="344" text-anchor="end" font-size="12" font-family="sans-serif">−1/4</text>
<text x="90" y="84" text-anchor="end" font-size="12" font-family="sans-serif">3/4</text>
<circle cx="100" cy="340" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
<line x1="108" y1="333" x2="178" y2="285" stroke="#dc2626" stroke-width="1.5"/>
<text x="184" y="278" font-size="13" font-family="sans-serif" fill="#991b1b">minimum x₂ = u₀ + u₁ = −1/4</text>
<text x="330" y="117" font-size="13" font-family="sans-serif" fill="#1e3a8a">feasible control histories</text>
<text x="375" y="218" font-size="12" font-family="sans-serif" fill="#334155">slew boundaries</text>
<text x="104" y="57" font-size="12" font-family="sans-serif" fill="#334155">p₀ = 1/4; |u₀|, |u₁| ≤ 1</text>
</svg>
