<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 330" role="img" aria-labelledby="geom-title geom-desc"><title id="geom-title">Analytic optimal control histories</title><desc id="geom-desc">T-S01 optimal histories form a segment; T-S02 includes the full control square; T-S03 leaves the first control free and fixes the terminal control at one.</desc><style>text{font-family:system-ui,sans-serif;fill:#e2e8f0}.title{font-size:16px;font-weight:650}.axis{font-size:12px;fill:#94a3b8}.label{font-size:14px}.family{font-size:13px;fill:#cbd5e1}.frame{fill:#0b1220;stroke:#475569;stroke-width:1}.grid{stroke:#334155;stroke-width:1}</style><g><text x="40" y="32" class="title">T-S01 exact integrator</text><rect x="40" y="70" width="190" height="190" class="frame"/><line x1="87.5" y1="70" x2="87.5" y2="260" class="grid"/><line x1="40" y1="117.5" x2="230" y2="117.5" class="grid"/><line x1="135.0" y1="70" x2="135.0" y2="260" class="grid"/><line x1="40" y1="165.0" x2="230" y2="165.0" class="grid"/><line x1="182.5" y1="70" x2="182.5" y2="260" class="grid"/><line x1="40" y1="212.5" x2="230" y2="212.5" class="grid"/><line x1="40" y1="70" x2="230" y2="260" stroke="#60a5fa" stroke-width="5"/><text x="40" y="286" class="axis">0</text><text x="230" y="286" class="axis" text-anchor="end">1</text><text x="135.0" y="307" class="label" text-anchor="middle">u₀</text><text x="24" y="165.0" class="label" text-anchor="middle" transform="rotate(-90 24 165.0)">u₁</text><text x="40" y="318" class="family">Segment</text></g><g><text x="350" y="32" class="title">T-S02 constant objective</text><rect x="350" y="70" width="190" height="190" class="frame"/><line x1="397.5" y1="70" x2="397.5" y2="260" class="grid"/><line x1="350" y1="117.5" x2="540" y2="117.5" class="grid"/><line x1="445.0" y1="70" x2="445.0" y2="260" class="grid"/><line x1="350" y1="165.0" x2="540" y2="165.0" class="grid"/><line x1="492.5" y1="70" x2="492.5" y2="260" class="grid"/><line x1="350" y1="212.5" x2="540" y2="212.5" class="grid"/><rect x="350" y="70" width="190" height="190" fill="#34d399" fill-opacity="0.27" stroke="#34d399" stroke-width="4"/><text x="350" y="286" class="axis">0</text><text x="540" y="286" class="axis" text-anchor="end">1</text><text x="445.0" y="307" class="label" text-anchor="middle">u₀</text><text x="334" y="165.0" class="label" text-anchor="middle" transform="rotate(-90 334 165.0)">u₁</text><text x="350" y="318" class="family">Full control square</text></g><g><text x="660" y="32" class="title">T-S03 singular objective</text><rect x="660" y="70" width="190" height="190" class="frame"/><line x1="707.5" y1="70" x2="707.5" y2="260" class="grid"/><line x1="660" y1="117.5" x2="850" y2="117.5" class="grid"/><line x1="755.0" y1="70" x2="755.0" y2="260" class="grid"/><line x1="660" y1="165.0" x2="850" y2="165.0" class="grid"/><line x1="802.5" y1="70" x2="802.5" y2="260" class="grid"/><line x1="660" y1="212.5" x2="850" y2="212.5" class="grid"/><line x1="660" y1="70" x2="850" y2="70" stroke="#fbbf24" stroke-width="6"/><text x="660" y="286" class="axis">0</text><text x="850" y="286" class="axis" text-anchor="end">1</text><text x="755.0" y="307" class="label" text-anchor="middle">u₀</text><text x="644" y="165.0" class="label" text-anchor="middle" transform="rotate(-90 644 165.0)">u₁</text><text x="660" y="318" class="family">Terminal edge</text></g></svg>
