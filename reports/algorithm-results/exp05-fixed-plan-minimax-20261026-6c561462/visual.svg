<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Finite fixed-plan minimax example</title>
  <desc id="desc">Two open-loop actions are selected before the disturbance. At stage one, action zero reaches states zero or two and has worst terminal cost one. Action one reaches one or three and has worst terminal cost two. The independent exhaustive oracle selects action zero with minimax value one.</desc>
  <rect width="760" height="430" fill="#172019"/>
  <g font-family="system-ui,sans-serif" fill="#dce5d5">
    <text x="380" y="32" text-anchor="middle" font-size="21">Fixed action before unknown disturbance</text>
    <text x="380" y="56" text-anchor="middle" font-size="13">x₀ = 0 · u ∈ {0,1} · w ∈ {0,2} · x₁ = x₀ + u + w</text>
    <g stroke="#405045" stroke-width="1"><path d="M110 340H680 M110 280H680 M110 220H680 M110 160H680 M110 100H680 M110 340V90 M680 340V90"/><path d="M110 340V90 M395 340V90 M680 340V90"/></g>
    <path d="M110 340H680 M110 340V90" fill="none" stroke="#a9b7a0" stroke-width="2"/>
    <path d="M110 340L395 340 M110 340L395 220" fill="none" stroke="#b4cda3" stroke-width="3"/>
    <path d="M110 340L395 280 M110 340L395 160" fill="none" stroke="#e9ad8d" stroke-width="3"/>
    <g fill="#f2f7ed" stroke="#b4cda3" stroke-width="2"><circle cx="110" cy="340" r="5"/><circle cx="395" cy="340" r="6"/><circle cx="395" cy="220" r="6"/></g>
    <g fill="#f2f7ed" stroke="#e9ad8d" stroke-width="2"><circle cx="110" cy="340" r="5"/><circle cx="395" cy="280" r="6"/><circle cx="395" cy="160" r="6"/></g>
    <g font-size="13"><text x="110" y="365" text-anchor="middle">stage 0</text><text x="395" y="365" text-anchor="middle">stage 1</text><text x="95" y="344" text-anchor="end">0</text><text x="95" y="284" text-anchor="end">1</text><text x="95" y="224" text-anchor="end">2</text><text x="95" y="164" text-anchor="end">3</text></g>
    <text x="48" y="220" text-anchor="middle" font-size="14" transform="rotate(-90 48 220)">state x</text>
    <text x="395" y="392" text-anchor="middle" font-size="14">Each line is one disturbance outcome for the same preselected action</text>
    <g font-size="14"><path d="M455 110h30" stroke="#b4cda3" stroke-width="3"/><text x="495" y="115">u=0: x₁∈{0,2}, worst |x₁−1|=1</text><path d="M455 145h30" stroke="#e9ad8d" stroke-width="3"/><text x="495" y="150">u=1: x₁∈{1,3}, worst |x₁−1|=2</text><text x="455" y="210">Safe at both stages: −10 ≤ x ≤ 10</text><text x="455" y="240">Exhaustive oracle: min(1,2) = 1</text><text x="455" y="270">Best fixed action: u=0</text></g>
    <text x="380" y="418" text-anchor="middle" font-size="12">One-stage scalar example · all 4 action-disturbance histories checked</text>
  </g>
</svg>
