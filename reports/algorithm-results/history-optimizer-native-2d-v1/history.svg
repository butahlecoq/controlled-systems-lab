<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740"><rect width="800" height="740" fill="white"/><text x="400" y="30" text-anchor="middle" font-size="18">2D integrator: full-history source-cost optimization</text><text x="400" y="58" text-anchor="middle" font-size="14">J = ||x₂ − (1,1)||₂ + 0.5(|u₀| + |u₁|)</text><path d="M100 650 H700 M100 650 V150" stroke="#444" fill="none"/><text x="400" y="700" text-anchor="middle">state x</text><text x="32" y="400" transform="rotate(-90 32 400)" text-anchor="middle">state y</text><polyline points="100,650 600,650 600,150" fill="none" stroke="#0072B2" stroke-width="4"/><polyline points="100,650 475,650 475,275" fill="none" stroke="#D55E00" stroke-width="3" stroke-dasharray="8 6"/><circle cx="600" cy="150" r="8" fill="#009E73"/><text x="520" y="95" fill="#0072B2">full source J: 1 (blue)</text><text x="520" y="120" fill="#D55E00">squared-terminal candidate: source J = 1.104 (dashed)</text><text x="400" y="728" text-anchor="middle" font-size="12">u₀ changes state x; u₁ changes state y. Green point is target (1,1).</text></svg>