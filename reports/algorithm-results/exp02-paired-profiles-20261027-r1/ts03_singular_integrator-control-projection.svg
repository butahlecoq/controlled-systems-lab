<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500"><rect width="100%" height="100%" fill="white"/><text x="60" y="45" font-family="sans-serif" font-size="24" font-weight="bold">T-S03 · singular integrator</text><text x="60" y="75" font-family="sans-serif" font-size="15">Feasible controls fill [0,1]²; the optimum is the edge u₁ = 1.</text><rect x="100" y="90" width="400" height="300" fill="#d8e9f5" stroke="#17324d" stroke-width="3"/><line x1="100" y1="90" x2="500" y2="90" stroke="#d76b00" stroke-width="9"/><line x1="100" y1="390" x2="500" y2="390" stroke="#222"/><line x1="100" y1="390" x2="100" y2="90" stroke="#222"/><text x="280" y="430" font-family="sans-serif" font-size="18">u₀</text><text x="55" y="245" font-family="sans-serif" font-size="18" transform="rotate(-90 55 245)">u₁</text><text x="92" y="414" font-family="sans-serif" font-size="14">0</text><text x="494" y="414" font-family="sans-serif" font-size="14">1</text><text x="78" y="395" font-family="sans-serif" font-size="14">0</text><text x="78" y="96" font-family="sans-serif" font-size="14">1</text><rect x="520" y="140" width="18" height="18" fill="#d8e9f5" stroke="#17324d"/><text x="550" y="155" font-family="sans-serif" font-size="15">feasible controls</text><line x1="520" y1="190" x2="540" y2="190" stroke="#d76b00" stroke-width="7"/><text x="550" y="195" font-family="sans-serif" font-size="15">optimal controls</text><text x="60" y="475" font-family="sans-serif" font-size="12" fill="#444">Analytic projection from the saved scenario; illustrates the entire optimal control family, not only sampled witnesses.</text></svg>