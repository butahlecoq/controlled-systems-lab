<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 310" role="img" aria-labelledby="title desc">
<title id="title">Three exact square hull fixtures</title><desc id="desc">Each panel plots its actual input points within the square from zero to two. The purple outline marks the four expected extreme corners. Teal points are redundant interior or edge points.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#192336}.title{font-size:15px;font-weight:700}.tick{font-size:11px;fill:#586579}.grid{stroke:#d9e0e8;stroke-width:1}.hull{fill:#7869c4;fill-opacity:.08;stroke:#5848a8;stroke-width:2.5}.corner{fill:#5848a8;stroke:white;stroke-width:1.5}.redundant{fill:#1a9b8a;stroke:white;stroke-width:1.2}</style>
<g><text x="125" y="20" text-anchor="middle" class="title">permuted</text><line x1="38" y1="235" x2="226" y2="235" class="grid"/><line x1="38" y1="235" x2="38" y2="47" class="grid"/><text x="38" y="253" text-anchor="middle" class="tick">0</text><text x="28" y="239" text-anchor="end" class="tick">0</text><line x1="38" y1="141" x2="226" y2="141" class="grid"/><line x1="132" y1="235" x2="132" y2="47" class="grid"/><text x="132" y="253" text-anchor="middle" class="tick">1</text><text x="28" y="145" text-anchor="end" class="tick">1</text><line x1="38" y1="47" x2="226" y2="47" class="grid"/><line x1="226" y1="235" x2="226" y2="47" class="grid"/><text x="226" y="253" text-anchor="middle" class="tick">2</text><text x="28" y="51" text-anchor="end" class="tick">2</text><polyline points="38,235 226,235 226,47 38,47 38,235" class="hull"/><circle cx="38" cy="235" r="6" class="corner"/><title>input point 0: (0, 0)</title><circle cx="132" cy="141" r="4.5" class="redundant"/><title>input point 1: (1, 1)</title><circle cx="226" cy="235" r="6" class="corner"/><title>input point 2: (2, 0)</title><circle cx="38" cy="47" r="6" class="corner"/><title>input point 3: (0, 2)</title><circle cx="226" cy="47" r="6" class="corner"/><title>input point 4: (2, 2)</title><circle cx="132" cy="235" r="4.5" class="redundant"/><title>input point 5: (1, 0)</title><circle cx="132" cy="47" r="4.5" class="redundant"/><title>input point 6: (1, 2)</title><circle cx="38" cy="141" r="4.5" class="redundant"/><title>input point 7: (0, 1)</title><circle cx="226" cy="141" r="4.5" class="redundant"/><title>input point 8: (2, 1)</title><circle cx="132" cy="94.0" r="4.5" class="redundant"/><title>input point 9: (1, 1.5)</title></g><g><text x="365" y="20" text-anchor="middle" class="title">degenerate</text><line x1="278" y1="235" x2="466" y2="235" class="grid"/><line x1="278" y1="235" x2="278" y2="47" class="grid"/><text x="278" y="253" text-anchor="middle" class="tick">0</text><text x="268" y="239" text-anchor="end" class="tick">0</text><line x1="278" y1="141" x2="466" y2="141" class="grid"/><line x1="372" y1="235" x2="372" y2="47" class="grid"/><text x="372" y="253" text-anchor="middle" class="tick">1</text><text x="268" y="145" text-anchor="end" class="tick">1</text><line x1="278" y1="47" x2="466" y2="47" class="grid"/><line x1="466" y1="235" x2="466" y2="47" class="grid"/><text x="466" y="253" text-anchor="middle" class="tick">2</text><text x="268" y="51" text-anchor="end" class="tick">2</text><polyline points="278,235 466,235 466,47 278,47 278,235" class="hull"/><circle cx="278" cy="235" r="6" class="corner"/><title>input point 0: (0, 0)</title><circle cx="466" cy="235" r="6" class="corner"/><title>input point 1: (2, 0)</title><circle cx="466" cy="47" r="6" class="corner"/><title>input point 2: (2, 2)</title><circle cx="278" cy="47" r="6" class="corner"/><title>input point 3: (0, 2)</title><circle cx="278" cy="235" r="6" class="corner"/><title>input point 4: (0, 0)</title><circle cx="372" cy="235" r="4.5" class="redundant"/><title>input point 5: (1, 0)</title><circle cx="372" cy="47" r="4.5" class="redundant"/><title>input point 6: (1, 2)</title></g><g><text x="605" y="20" text-anchor="middle" class="title">interior-basis</text><line x1="518" y1="235" x2="706" y2="235" class="grid"/><line x1="518" y1="235" x2="518" y2="47" class="grid"/><text x="518" y="253" text-anchor="middle" class="tick">0</text><text x="508" y="239" text-anchor="end" class="tick">0</text><line x1="518" y1="141" x2="706" y2="141" class="grid"/><line x1="612" y1="235" x2="612" y2="47" class="grid"/><text x="612" y="253" text-anchor="middle" class="tick">1</text><text x="508" y="145" text-anchor="end" class="tick">1</text><line x1="518" y1="47" x2="706" y2="47" class="grid"/><line x1="706" y1="235" x2="706" y2="47" class="grid"/><text x="706" y="253" text-anchor="middle" class="tick">2</text><text x="508" y="51" text-anchor="end" class="tick">2</text><polyline points="518,235 706,235 706,47 518,47 518,235" class="hull"/><circle cx="612" cy="141" r="4.5" class="redundant"/><title>input point 0: (1, 1)</title><circle cx="518" cy="235" r="6" class="corner"/><title>input point 1: (0, 0)</title><circle cx="706" cy="235" r="6" class="corner"/><title>input point 2: (2, 0)</title><circle cx="706" cy="47" r="6" class="corner"/><title>input point 3: (2, 2)</title><circle cx="518" cy="47" r="6" class="corner"/><title>input point 4: (0, 2)</title></g>
