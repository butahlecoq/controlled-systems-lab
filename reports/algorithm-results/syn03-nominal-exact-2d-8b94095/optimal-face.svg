<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-labelledby="title description">
  <title id="title">Complete optimal terminal-state set</title>
  <desc id="description">The feasible upper triangle lies inside the unit square. Every point on the diagonal segment from (0,1) to (1,0) is optimal, with objective one.</desc>
  <style>.axis{stroke:#405366;stroke-width:2}.grid{stroke:#dce3ea;stroke-width:1}.face{stroke:#bc3c2e;stroke-width:7;stroke-linecap:round}.tick{font:15px system-ui,sans-serif;fill:#405366}.label{font:17px system-ui,sans-serif;fill:#18212b}.point{fill:#bc3c2e}</style>
  <rect width="560" height="430" fill="#fbfcfe"/>
  <path class="grid" d="M110 330H430 M110 250H430 M110 170H430 M190 90V330 M270 90V330 M350 90V330 M430 90V330"/>
  <path fill="#dcefe7" stroke="#568a72" stroke-width="2" d="M110 90H430V330H110Z"/>
  <path fill="#f3ddd8" d="M110 90H430V330Z"/>
  <path class="axis" d="M110 350V70 M90 330H450"/>
  <path class="face" d="M110 90L430 330"/>
  <circle class="point" cx="110" cy="90" r="6"/><circle class="point" cx="430" cy="330" r="6"/>
  <text class="tick" x="99" y="375">0</text><text class="tick" x="420" y="375">1</text>
  <text class="tick" x="76" y="96">1</text><text class="tick" x="76" y="336">0</text>
  <text class="label" x="456" y="336">x₁</text><text class="label" x="102" y="57">y₁</text>
  <text class="label" x="186" y="184">optimal face: x₁+y₁=1</text>
  <text class="label" x="88" y="407">Exact optimum = 1; every red-segment point is optimal.</text>
</svg>
