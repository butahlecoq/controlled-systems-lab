<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="title desc">
<title id="title">Nonzero-origin terminal membership regression</title>
<desc id="desc">Three separate coordinate domains show the saved recovered initial state, terminal state, and control. Terminal and control values are distinct.</desc>
<style>text{font-family:Inter,system-ui,sans-serif;fill:#f8f8f2}.title{font-size:22px;font-weight:650}.panel{font-size:18px;font-weight:600}.frame{fill:#303129;stroke:#504945}.domain{fill:#a6e22e;fill-opacity:.2;stroke:#a6e22e;stroke-width:2}.point{fill:#fd971f;stroke:#272822;stroke-width:2}.label{font-size:14px}.axis,.tick{fill:#b7b7af;font-size:12px}</style>
<rect width="420" height="1080" fill="#272822"/>
<text x="42" y="42" class="title">Recovered witness</text><text x="42" y="85" class="panel">Initial state x₀</text><rect x="78" y="134" width="258" height="206" class="frame"/><polygon points="78.0,340.0 336.0,340.0 336.0,134.0 78.0,134.0" class="domain"/><circle cx="336.0" cy="134.0" r="7" class="point"/><text x="345.0" y="126.0" class="label">In=(2,3)</text><text x="207.0" y="384" class="axis" text-anchor="middle">coordinate 1</text><text x="78" y="360" class="tick">1</text><text x="324" y="360" class="tick">2</text><text x="45" y="344" class="tick">2</text><text x="45" y="138" class="tick">3</text><text x="42" y="395" class="panel">Terminal state x₁</text><rect x="78" y="444" width="258" height="206" class="frame"/><polygon points="78.0,650.0 336.0,650.0 336.0,444.0 78.0,444.0" class="domain"/><circle cx="336.0" cy="650.0" r="7" class="point"/><text x="345.0" y="642.0" class="label">Te=(3,4)</text><text x="207.0" y="694" class="axis" text-anchor="middle">coordinate 1</text><text x="78" y="670" class="tick">2</text><text x="324" y="670" class="tick">3</text><text x="45" y="654" class="tick">4</text><text x="45" y="448" class="tick">5</text><text x="42" y="705" class="panel">Control u₀</text><rect x="78" y="754" width="258" height="206" class="frame"/><polygon points="78.0,960.0 336.0,960.0 336.0,754.0 78.0,754.0" class="domain"/><circle cx="336.0" cy="960.0" r="7" class="point"/><text x="345.0" y="952.0" class="label">Co=(1,1)</text><text x="207.0" y="1004" class="axis" text-anchor="middle">coordinate 1</text><text x="78" y="980" class="tick">0</text><text x="324" y="980" class="tick">1</text><text x="45" y="964" class="tick">1</text><text x="45" y="758" class="tick">2</text><text x="42" y="1040" class="axis">Dynamics: x₁=x₀+u₀; each vector satisfies its declared domain.</text><text x="42" y="1060" class="axis">The endpoint belongs to the returned terminal family.</text>
</svg>