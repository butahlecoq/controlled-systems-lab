<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Nonzero-origin terminal membership regression</title>
<desc id="desc">Three separate coordinate domains show the saved recovered initial state, terminal state, and control. Terminal and control values are distinct.</desc>
<style>text{font-family:Inter,system-ui,sans-serif;fill:#111}.title{font-size:22px;font-weight:650}.panel{font-size:18px;font-weight:600}.frame{fill:#fff;stroke:#aaa}.domain{fill:#294717;fill-opacity:.2;stroke:#294717;stroke-width:2}.point{fill:#864800;stroke:#fff;stroke-width:2}.label{font-size:14px}.axis,.tick{fill:#444;font-size:12px}</style>
<rect width="1200" height="440" fill="#fff"/>
<text x="42" y="42" class="title">A recovered witness distinguishes terminal state from control</text><text x="42" y="68" class="panel">Initial state x₀</text><rect x="78" y="117" width="258" height="206" class="frame"/><polygon points="78.0,323.0 336.0,323.0 336.0,117.0 78.0,117.0" class="domain"/><circle cx="336.0" cy="117.0" r="7" class="point"/><text x="345.0" y="109.0" class="label">In=(2,3)</text><text x="207.0" y="367" class="axis" text-anchor="middle">coordinate 1</text><text x="78" y="343" class="tick">1</text><text x="324" y="343" class="tick">2</text><text x="45" y="327" class="tick">2</text><text x="45" y="121" class="tick">3</text><text x="430" y="68" class="panel">Terminal state x₁</text><rect x="466" y="117" width="258" height="206" class="frame"/><polygon points="466.0,323.0 724.0,323.0 724.0,117.0 466.0,117.0" class="domain"/><circle cx="724.0" cy="323.0" r="7" class="point"/><text x="733.0" y="315.0" class="label">Te=(3,4)</text><text x="595.0" y="367" class="axis" text-anchor="middle">coordinate 1</text><text x="466" y="343" class="tick">2</text><text x="712" y="343" class="tick">3</text><text x="433" y="327" class="tick">4</text><text x="433" y="121" class="tick">5</text><text x="818" y="68" class="panel">Control u₀</text><rect x="854" y="117" width="258" height="206" class="frame"/><polygon points="854.0,323.0 1112.0,323.0 1112.0,117.0 854.0,117.0" class="domain"/><circle cx="1112.0" cy="323.0" r="7" class="point"/><text x="1121.0" y="315.0" class="label">Co=(1,1)</text><text x="983.0" y="367" class="axis" text-anchor="middle">coordinate 1</text><text x="854" y="343" class="tick">0</text><text x="1100" y="343" class="tick">1</text><text x="821" y="327" class="tick">1</text><text x="821" y="121" class="tick">2</text><text x="42" y="420" class="axis">Dynamics: x₁=x₀+u₀; each vector satisfies its declared domain; endpoint is in the returned family.</text>
</svg>