<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" role="img" aria-labelledby="title desc"><title id="title">Equivalent state constraints with 2, 4, or 8 authored H rows</title><desc id="desc">All three scalar state descriptions define the same interval from minus two to two. Additional H inequalities are looser redundant bounds.</desc><rect width="820" height="290" fill="white"/><text x="30" y="30" font-family="sans-serif" font-size="18" font-weight="bold">Same state interval, increasing authored H-row count</text><line x1="90" y1="145" x2="730" y2="145" stroke="#334155" stroke-width="2"/><text x="742" y="150" font-family="sans-serif" font-size="14">x</text><line x1="170.0" y1="140" x2="170.0" y2="150" stroke="#475569"/><text x="162.0" y="170" font-family="sans-serif" font-size="12">-3</text><line x1="210.0" y1="140" x2="210.0" y2="150" stroke="#475569"/><text x="202.0" y="170" font-family="sans-serif" font-size="12">-2.5</text><line x1="250.0" y1="140" x2="250.0" y2="150" stroke="#475569"/><text x="242.0" y="170" font-family="sans-serif" font-size="12">-2</text><line x1="410.0" y1="140" x2="410.0" y2="150" stroke="#475569"/><text x="402.0" y="170" font-family="sans-serif" font-size="12">0</text><line x1="570.0" y1="140" x2="570.0" y2="150" stroke="#475569"/><text x="562.0" y="170" font-family="sans-serif" font-size="12">2</text><line x1="610.0" y1="140" x2="610.0" y2="150" stroke="#475569"/><text x="602.0" y="170" font-family="sans-serif" font-size="12">2.5</text><line x1="650.0" y1="140" x2="650.0" y2="150" stroke="#475569"/><text x="642.0" y="170" font-family="sans-serif" font-size="12">3</text><rect x="250.0" y="127" width="320.0" height="36" rx="4" fill="#2563eb" fill-opacity="0.20" stroke="#1d4ed8" stroke-width="2"/><text x="362.0" y="150" font-family="sans-serif" font-size="13">feasible set [-2,2]</text><line x1="210.0" y1="111" x2="210.0" y2="179" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4"/><line x1="610.0" y1="111" x2="610.0" y2="179" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4"/><text x="30" y="220" font-family="sans-serif" font-size="13" fill="#166534">4 rows/stage add bounds at ±2.5 (green)</text><line x1="170.0" y1="111" x2="170.0" y2="179" stroke="#c2410c" stroke-width="2" stroke-dasharray="3 4"/><line x1="650.0" y1="111" x2="650.0" y2="179" stroke="#c2410c" stroke-width="2" stroke-dasharray="3 4"/><text x="30" y="247" font-family="sans-serif" font-size="13" fill="#9a3412">8 rows/stage also add looser bounds at ±3 (orange)</text><text x="30" y="275" font-family="sans-serif" font-size="12" fill="#475569">All are exact redundant inequalities over the shared state interval; dimension, horizon and dynamics stay fixed.</text></svg>