<circle cx="819.00" cy="270.00" r="7" fill="#c4a7e7" stroke="#191724" stroke-width="2"><title>point 6: redundant edge or interior point</title></circle>
<text x="828.00" y="262.00" fill="#e0def4" font-size="13" font-family="sans-serif">6</text>
