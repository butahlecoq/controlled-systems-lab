<circle cx="171.00" cy="110.00" r="7" fill="#f6c177" stroke="#191724" stroke-width="2"><title>point 3: hull vertex</title></circle>
<text x="180.00" y="102.00" fill="#e0def4" font-size="13" font-family="sans-serif">3</text>
<circle cx="495.00" cy="270.00" r="7" fill="#c4a7e7" stroke="#191724" stroke-width="2"><title>point 4: redundant edge or interior point</title></circle>
