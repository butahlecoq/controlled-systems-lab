<polygon points="171.00,430.00 819.00,430.00 819.00,110.00 171.00,110.00" fill="none" stroke="#eb6f92" stroke-width="3" stroke-dasharray="8 5"/>
<polygon points="171.00,430.00 819.00,430.00 819.00,110.00 171.00,110.00" fill="none" stroke="#3e8fb0" stroke-width="3" stroke-dasharray="none"/>
<circle cx="171.00" cy="430.00" r="7" fill="#f6c177" stroke="#191724" stroke-width="2"><title>point 0: hull vertex</title></circle>
