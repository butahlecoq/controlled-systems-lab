<text x="495.0" y="530" text-anchor="middle" fill="#e0def4" font-family="sans-serif">x</text>
<text x="28" y="270.0" text-anchor="middle" transform="rotate(-90 28 270.0)" fill="#e0def4" font-family="sans-serif">y</text>
<path d="M 171.0 70 V 470" stroke="#393552"/>
<path d="M 90 430.0 H 900" stroke="#393552"/>
<text x="171.0" y="490" text-anchor="middle" fill="#908caa" font-family="sans-serif">0</text>
<text x="76" y="434.0" text-anchor="end" fill="#908caa" font-family="sans-serif">0</text>
<path d="M 495.0 70 V 470" stroke="#393552"/>
<path d="M 90 270.0 H 900" stroke="#393552"/>
