l="#111827"/><text x="345" y="45" font-family="sans-serif" font-size="12" fill="#3b82f6">R0: [0,0]²</text><text x="345" y="67" font-family="sans-serif" font-size="12" fill="#22c55e">R1: [0,1]²</text><text x="345" y="89" font-family="sans-serif" font-size="12" fill="#f59e0b">R2: [0,2]²</text><text x="345" y="111" font-family="sans-serif" font-size="12" fill="#ef4444">R3: [0,3]²</text><text x="345" y="133" font-family="sans-serif" font-size="12" fill="#8b5cf6">R4: [0,4]²</text><text x="30" y="405" font-family="sans-serif" font-size="12" fill="#475569">Analytic geometry from A=I, B=I, 0≤u≤1. Forward/backward layers are explanatory, not saved strategy iterates.</text></svg>