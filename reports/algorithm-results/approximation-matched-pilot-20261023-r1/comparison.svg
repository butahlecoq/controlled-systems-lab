<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 390" role="img" aria-labelledby="title desc">
<title id="title">Approximation areas on one exact diamond</title>
<desc id="desc">Each panel overlays one output with the exact input diamond. Ratios are output area divided by the exact input area.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="625" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Same diamond input: output area and enclosure shape</text>
<text x="125.0" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">Exact polygon</text>
<line x1="25" y1="200" x2="225" y2="200" stroke="#9ca3af"/>
<line x1="125.0" y1="100" x2="125.0" y2="300" stroke="#9ca3af"/>
<text x="222" y="214" font-family="sans-serif" font-size="10">x</text>
<text x="130.0" y="106" font-family="sans-serif" font-size="10">y</text>
<line x1="53.0" y1="196" x2="53.0" y2="204" stroke="#6b7280"/>
<text x="53.0" y="217" text-anchor="middle" font-family="sans-serif" font-size="9">−2</text>
<line x1="121.0" y1="272" x2="129.0" y2="272" stroke="#6b7280"/>
<text x="133.0" y="275" font-family="sans-serif" font-size="9">−2</text>
<line x1="197.0" y1="196" x2="197.0" y2="204" stroke="#6b7280"/>
<text x="197.0" y="217" text-anchor="middle" font-family="sans-serif" font-size="9">2</text>
<line x1="121.0" y1="128" x2="129.0" y2="128" stroke="#6b7280"/>
<text x="133.0" y="131" font-family="sans-serif" font-size="9">2</text>
<polygon points="125.0,128 197.0,200 125.0,272 53.0,200" fill="#355c7d" fill-opacity="0.10" stroke="#355c7d" stroke-width="2"/>
<polygon points="125.0,128 197.0,200 125.0,272 53.0,200" fill="none" stroke="#355c7d" stroke-width="3"/>
<text x="125.0" y="330" text-anchor="middle" font-family="sans-serif" font-size="13">area ratio: 1</text>
<text x="125.0" y="350" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">blue outline/fill = exact reference</text>
<text x="375.0" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">Axis box</text>
