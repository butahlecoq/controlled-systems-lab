name: Deploy Pages with metadata retry
description: Run the pinned Pages deployer with a narrow artifact metadata retry
inputs:
  token:
    description: GitHub token
    default: ${{ github.token }}
    required: true
  timeout:
    description: Deployment timeout in milliseconds
    required: false
    default: '600000'
  error_count:
    description: Maximum deployment status errors
    required: false
    default: '10'
  reporting_interval:
    description: Initial interval between deployment status reports
    required: false
    default: '5000'
  artifact_name:
    description: Name of the Pages artifact
    required: false
    default: github-pages
  preview:
    description: Whether this deploys a Pages preview
    required: false
    default: 'false'
outputs:
  page_url:
    description: URL to deployed GitHub Pages
runs:
  using: node24
  main: index.js
