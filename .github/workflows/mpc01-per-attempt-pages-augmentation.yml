name: MPC-01 per-attempt Pages augmentation

on:
  pull_request:
    paths:
      - .github/workflows/mpc01-per-attempt-pages-augmentation.yml
      - scripts/reports/mpc01/stage_per_attempt.py
      - scripts/reports/mpc01/augment_pages.py
      - scripts/reports/mpc01/summarize_per_attempt.py
      - scripts/reports/mpc01/summarize_strategy_ab_ts03.py
      - scripts/reports/mpc01/summarize_strategy_ab_ts02.py
      - scripts/reports/mpc01/summarize_strategy_ab.py
      - scripts/reports/check_deploy_head.py
      - scripts/reports/mpc01/build_strategy_ab_records.py
      - scripts/reports/mpc01/write_strategy_ab_build_note.py
      - scripts/reports/mpc01/sanitize_strategy_ab_bundle.py
      - scripts/reports/mpc01/validate_strategy_ab_ts03_bundle.py
      - docs/research/evidence/mpc01-per-attempt-20261103-r3/**
      - docs/research/evidence/mpc01-strategy-ab-ts03-20261103-r1/**
      - docs/research/evidence/mpc01-strategy-ab-ts02-per-attempt-20261103/**
      - docs/research/evidence/mpc01-strategy-ab-ts01-per-attempt-20261103/**
      - tests/reporting/test_mpc01_per_attempt_publication.py
      - tests/reporting/test_mpc01_pages_augmentation.py
      - tests/reporting/test_deploy_head.py
  workflow_run:
    workflows: [Algorithm report records and site]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate the saved attempt and Strategy A/B evidence
        run: |
          python scripts/reports/mpc01/summarize_per_attempt.py \
            --bundle docs/research/evidence/mpc01-per-attempt-20261103-r3 \
            --output build/mpc01-per-attempt/benchmark-summary.txt
          (cd docs/research/evidence/mpc01-per-attempt-20261103-r3 && sha256sum -c SHA256SUMS)
          python scripts/reports/mpc01/validate_strategy_ab_ts03_bundle.py
          python scripts/reports/mpc01/summarize_strategy_ab_ts02.py \
            --events docs/research/evidence/mpc01-strategy-ab-ts02-per-attempt-20261103/strategy-ab-ts02-events.jsonl \
            --stdout docs/research/evidence/mpc01-strategy-ab-ts02-per-attempt-20261103/strategy-ab-ts02-stdout.jsonl \
            --scenario docs/research/evidence/mpc01-strategy-ab-ts02-per-attempt-20261103/scenario.json \
            --environment docs/research/evidence/mpc01-strategy-ab-ts02-per-attempt-20261103/strategy-ab-ts02-environment.json \
            --resource-profile docs/research/evidence/mpc01-strategy-ab-ts02-per-attempt-20261103/resource-profile.json \
            --record docs/research/evidence/mpc01-strategy-ab-ts02-per-attempt-20261103/strategy-ab-ts02-comparison-record.json \
            --output docs/research/evidence/mpc01-strategy-ab-ts02-per-attempt-20261103/strategy-ab-ts02-summary.html
          (cd docs/research/evidence/mpc01-strategy-ab-ts02-per-attempt-20261103 && sha256sum -c SHA256SUMS)
          python scripts/reports/mpc01/build_strategy_ab_records.py \
            --events docs/research/evidence/mpc01-strategy-ab-ts01-per-attempt-20261103/strategy-ab-ts01-events.jsonl \
            --scenario docs/research/evidence/mpc01-strategy-ab-ts01-per-attempt-20261103/scenario.json \
            --environment docs/research/evidence/mpc01-strategy-ab-ts01-per-attempt-20261103/strategy-ab-ts01-environment.json \
            --codec-environment docs/research/evidence/mpc01-strategy-ab-ts01-per-attempt-20261103/codec-environment.json \
            --output docs/research/evidence/mpc01-strategy-ab-ts01-per-attempt-20261103/comparison-record.json
          python scripts/reports/mpc01/summarize_strategy_ab.py \
            --events docs/research/evidence/mpc01-strategy-ab-ts01-per-attempt-20261103/strategy-ab-ts01-events.jsonl \
            --stdout docs/research/evidence/mpc01-strategy-ab-ts01-per-attempt-20261103/strategy-ab-ts01-stdout.jsonl \
            --scenario docs/research/evidence/mpc01-strategy-ab-ts01-per-attempt-20261103/scenario.json \
            --environment docs/research/evidence/mpc01-strategy-ab-ts01-per-attempt-20261103/strategy-ab-ts01-environment.json \
            --resource-profile docs/research/evidence/mpc01-strategy-ab-ts01-per-attempt-20261103/resource-profile.json \
            --output docs/research/evidence/mpc01-strategy-ab-ts01-per-attempt-20261103/strategy-ab-ts01-summary.txt
          (cd docs/research/evidence/mpc01-strategy-ab-ts01-per-attempt-20261103 && sha256sum -c SHA256SUMS)
          python -m unittest tests.reporting.test_deploy_head
          python -m unittest tests.reporting.test_mpc01_pages_augmentation
          python -m unittest tests.reporting.test_mpc01_per_attempt_publication
      - name: Stage and verify the augmented site route
        run: |
          mkdir -p build/report-site/examples
          printf '%s\n' '<!doctype html><html><body><h1>Reports</h1></body></html>' > build/report-site/index.html
          printf '%s\n' '<!doctype html><html><body><h1>Examples</h1></body></html>' > build/report-site/examples/index.html
          python scripts/reports/mpc01/stage_per_attempt.py --site build/report-site
          python scripts/reports/mpc01/stage_per_attempt.py --site build/report-site --check
          python -m unittest tests.reporting.test_mpc01_per_attempt_publication

  augment:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Check whether the source run still targets current main
        id: source_head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/reports/check_deploy_head.py --check-only

      - name: Validate the saved attempt and Strategy A/B evidence
        if: steps.source_head.outputs.current == 'true'
        run: |
          python scripts/reports/mpc01/summarize_per_attempt.py \
            --bundle docs/research/evidence/mpc01-per-attempt-20261103-r3 \
            --output build/mpc01-per-attempt/benchmark-summary.txt
          (cd docs/research/evidence/mpc01-per-attempt-20261103-r3 && sha256sum -c SHA256SUMS)
          python scripts/reports/mpc01/validate_strategy_ab_ts03_bundle.py
          python scripts/reports/mpc01/summarize_strategy_ab_ts02.py \
            --events docs/research/evidence/mpc01-strategy-ab-ts02-per-attempt-20261103/strategy-ab-ts02-events.jsonl \
            --stdout docs/research/evidence/mpc01-strategy-ab-ts02-per-attempt-20261103/strategy-ab-ts02-stdout.jsonl \
            --scenario docs/research/evidence/mpc01-strategy-ab-ts02-per-attempt-20261103/scenario.json \
            --environment docs/research/evidence/mpc01-strategy-ab-ts02-per-attempt-20261103/strategy-ab-ts02-environment.json \
            --resource-profile docs/research/evidence/mpc01-strategy-ab-ts02-per-attempt-20261103/resource-profile.json \
            --record docs/research/evidence/mpc01-strategy-ab-ts02-per-attempt-20261103/strategy-ab-ts02-comparison-record.json \
            --output docs/research/evidence/mpc01-strategy-ab-ts02-per-attempt-20261103/strategy-ab-ts02-summary.html
          (cd docs/research/evidence/mpc01-strategy-ab-ts02-per-attempt-20261103 && sha256sum -c SHA256SUMS)
          python scripts/reports/mpc01/build_strategy_ab_records.py \
            --events docs/research/evidence/mpc01-strategy-ab-ts01-per-attempt-20261103/strategy-ab-ts01-events.jsonl \
            --scenario docs/research/evidence/mpc01-strategy-ab-ts01-per-attempt-20261103/scenario.json \
            --environment docs/research/evidence/mpc01-strategy-ab-ts01-per-attempt-20261103/strategy-ab-ts01-environment.json \
            --codec-environment docs/research/evidence/mpc01-strategy-ab-ts01-per-attempt-20261103/codec-environment.json \
            --output docs/research/evidence/mpc01-strategy-ab-ts01-per-attempt-20261103/comparison-record.json
          python scripts/reports/mpc01/summarize_strategy_ab.py \
            --events docs/research/evidence/mpc01-strategy-ab-ts01-per-attempt-20261103/strategy-ab-ts01-events.jsonl \
            --stdout docs/research/evidence/mpc01-strategy-ab-ts01-per-attempt-20261103/strategy-ab-ts01-stdout.jsonl \
            --scenario docs/research/evidence/mpc01-strategy-ab-ts01-per-attempt-20261103/scenario.json \
            --environment docs/research/evidence/mpc01-strategy-ab-ts01-per-attempt-20261103/strategy-ab-ts01-environment.json \
            --resource-profile docs/research/evidence/mpc01-strategy-ab-ts01-per-attempt-20261103/resource-profile.json \
            --output docs/research/evidence/mpc01-strategy-ab-ts01-per-attempt-20261103/strategy-ab-ts01-summary.txt
          (cd docs/research/evidence/mpc01-strategy-ab-ts01-per-attempt-20261103 && sha256sum -c SHA256SUMS)

      - name: Find the upstream Pages artifact
        id: artifact
        if: steps.source_head.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          url = (f"{os.environ['API_URL']}/repos/{os.environ['REPOSITORY']}"
                 f"/actions/runs/{os.environ['RUN_ID']}/artifacts?per_page=100")
          request = Request(url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
          })
          with urlopen(request, timeout=15) as response:
              artifacts = json.load(response)['artifacts']
          matches = [item for item in artifacts if item.get('name') == 'github-pages']
          if len(matches) > 1:
              raise SystemExit('upstream run has multiple github-pages artifacts')
          found = bool(matches) and not matches[0].get('expired', True)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"found={'true' if found else 'false'}\n")
          print('Found an unexpired Pages artifact' if found else 'No Pages artifact; augmentation is skipped')
          PY

      - name: Download the complete upstream Pages artifact
        if: steps.artifact.outputs.found == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: github-pages
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: build/pages-download

      - name: Safely extract the Pages site
        if: steps.artifact.outputs.found == 'true'
        run: python scripts/reports/mpc01/augment_pages.py --download build/pages-download --destination build/report-site

      - name: Stage and verify the per-attempt route
        if: steps.artifact.outputs.found == 'true'
        run: |
          python scripts/reports/mpc01/stage_per_attempt.py --site build/report-site
          python scripts/reports/mpc01/stage_per_attempt.py --site build/report-site --check

      - name: Apply the shared Pages route policy before upload
        if: steps.artifact.outputs.found == 'true'
        run: python scripts/reports/pages_route_retirement.py --site build/report-site

      - name: Check that the augmented artifact still targets current main
        if: steps.artifact.outputs.found == 'true'
        id: head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/reports/check_deploy_head.py

      - name: Upload the complete augmented Pages site
        if: steps.artifact.outputs.found == 'true' && steps.head.outputs.current == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/report-site
