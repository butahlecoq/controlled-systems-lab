      - 'tests/reporting/test_syn03_strategy_a_report.py'
      - 'tests/reporting/test_syn03_ts02_report.py'
      - 'tests/reporting/test_opt07_*.py'
      - 'tests/reporting/test_opt11_publication.py'
      - 'pyproject.toml'
      - 'requirements-quality.txt'
      - '.github/workflows/python-quality.yml'

permissions:
  contents: read

jobs:
  python-ci-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned quality tools
        run: python -m pip install --disable-pip-version-check -r requirements-quality.txt -r scripts/reports/requirements.txt
      - name: Lint selected maintained Python tooling
        run: ruff check
      - name: Check formatting
        run: ruff format --check
      - name: Check types
        run: ty check
      - name: Exercise real Git and process behavior
        run: python -m unittest discover -s tests/ci -p 'test_*.py'
      - name: Exercise site additions and the APP02 staging caller
        run: |
          python -m unittest discover -s tests/reporting -p 'test_site_additions.py'
          python -m unittest discover -s tests/reporting -p 'test_app02_saved.py'
      - name: Exercise maintained compatibility entry points
        run: |
          python -m unittest discover -s tests/reporting -p 'test_syn03_strategy_a_report.py'
          python -m unittest discover -s tests/reporting -p 'test_syn03_ts02_report.py'
      - name: Exercise shared publication owners and malformed-input boundaries
        env:
          MPLBACKEND: Agg
        run: |
          python -m unittest tests.reporting.test_report_data tests.reporting.test_render tests.reporting.test_publication_policy tests.reporting.test_report_source_identity tests.reporting.test_registered_kinds tests.reporting.test_landing tests.reporting.test_learning_book tests.reporting.test_plot tests.reporting.test_b04_publication_source_snapshot tests.reporting.test_publication_spine_boundaries
      - name: Exercise saved publication and collector consumer families
        env:
          MPLBACKEND: Agg
        run: |
          python -m unittest tests.reporting.test_convex_report tests.reporting.test_opt07_collector tests.reporting.test_opt12_collector tests.reporting.test_visual_examples tests.reporting.test_geo07_publication tests.reporting.test_geo07_port_publication tests.reporting.test_geo07_dependent_publication tests.reporting.test_finite_feedback_publication tests.reporting.test_ext04_publication tests.reporting.test_report_lifecycle


      - name: Check the locked source-only native row-scaling publication
        run: python -m unittest discover -s tests/reporting -p 'test_stage_native_row_scaling_diagnostic.py'
      - name: Exercise OPT07 and OPT11 collectors, oracles and saved reports
        run: |
          python -m unittest discover -s tests/reporting -p 'test_opt07_*.py'
          python -m unittest discover -s tests/reporting -p 'test_opt11_publication.py'
          python -m unittest discover -s reports/algorithm-results/tooling/opt11 -p 'test_collect.py'
