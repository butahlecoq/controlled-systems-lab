name: Python tooling quality

on:
  pull_request:
    paths:
      - '.github/actions/pages-deploy/**'
      - 'scripts/ci/**'
      - 'tests/ci/**'
      - 'scripts/catalogue/**'
      - 'reports/algorithm-results/tooling/**'
      - 'scripts/reports/frozen_native_bundle.py'
      - 'scripts/reports/stage_native_model_catalogue.py'
      - 'scripts/reports/stage_native_extended_models.py'
      - 'scripts/reports/site_additions.py'
      - 'scripts/reports/stage_app02.py'
      - 'tests/reporting/test_site_additions.py'
      - 'tests/reporting/test_app02_saved.py'
      - 'scripts/reports/capture_history_optimizer_native.py'
      - 'scripts/reports/stage_history_optimizer_native.py'
      - 'tests/reporting/test_history_optimizer_native.py'
      - 'reports/algorithm-results/history-optimizer-native-2d-v1/**'
      - 'scripts/reports/stage_native_row_scaling_diagnostic.py'
      - 'tests/reporting/test_stage_native_row_scaling_diagnostic.py'
      - 'reports/algorithm-results/native-row-scaling-diagnostic-v1/**'
      - 'tests/reporting/test_syn03_strategy_a_report.py'
      - 'tests/reporting/test_syn03_ts02_report.py'
      - 'tests/reporting/test_opt07_*.py'
      - 'tests/reporting/test_opt11_publication.py'
      - 'pyproject.toml'
      - 'requirements-quality.txt'
      - '.github/workflows/python-quality.yml'
  push:
    branches: [main]
    paths:
      - '.github/actions/pages-deploy/**'
      - 'scripts/ci/**'
      - 'tests/ci/**'
      - 'scripts/catalogue/**'
      - 'reports/algorithm-results/tooling/**'
      - 'scripts/reports/frozen_native_bundle.py'
      - 'scripts/reports/stage_native_model_catalogue.py'
      - 'scripts/reports/stage_native_extended_models.py'
      - 'scripts/reports/site_additions.py'
      - 'scripts/reports/stage_app02.py'
      - 'tests/reporting/test_site_additions.py'
      - 'tests/reporting/test_app02_saved.py'
      - 'scripts/reports/capture_history_optimizer_native.py'
      - 'scripts/reports/stage_history_optimizer_native.py'
      - 'tests/reporting/test_history_optimizer_native.py'
      - 'reports/algorithm-results/history-optimizer-native-2d-v1/**'
      - 'scripts/reports/stage_native_row_scaling_diagnostic.py'
      - 'tests/reporting/test_stage_native_row_scaling_diagnostic.py'
      - 'reports/algorithm-results/native-row-scaling-diagnostic-v1/**'
      - 'tests/reporting/test_syn03_strategy_a_report.py'
      - 'tests/reporting/test_syn03_ts02_report.py'
      - 'tests/reporting/test_opt07_*.py'
      - 'tests/reporting/test_opt11_publication.py'
      - 'pyproject.toml'
      - 'requirements-quality.txt'
      - '.github/workflows/python-quality.yml'

permissions:
  contents: read

jobs:
  python-ci-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned quality tools
        run: python -m pip install --disable-pip-version-check -r requirements-quality.txt
      - name: Lint selected maintained Python tooling
        run: ruff check
      - name: Check formatting
        run: ruff format --check
      - name: Check types
        run: ty check
      - name: Exercise real Git and process behavior
        run: python -m unittest discover -s tests/ci -p 'test_*.py'
      - name: Exercise site additions and the APP02 staging caller
        run: |
          python -m unittest discover -s tests/reporting -p 'test_site_additions.py'
          python -m unittest discover -s tests/reporting -p 'test_app02_saved.py'
      - name: Exercise maintained compatibility entry points
        run: |
          python -m unittest discover -s tests/reporting -p 'test_syn03_strategy_a_report.py'
          python -m unittest discover -s tests/reporting -p 'test_syn03_ts02_report.py'
      - name: Check the locked source-only native row-scaling publication
        run: python -m unittest discover -s tests/reporting -p 'test_stage_native_row_scaling_diagnostic.py'
      - name: Check the saved native whole-history optimizer route
        run: python -m unittest discover -s tests/reporting -p 'test_history_optimizer_native.py'
      - name: Exercise OPT07 and OPT11 collectors, oracles and saved reports
        run: |
          python -m unittest discover -s tests/reporting -p 'test_opt07_*.py'
          python -m unittest discover -s tests/reporting -p 'test_opt11_publication.py'
          python -m unittest discover -s reports/algorithm-results/tooling/opt11 -p 'test_collect.py'
