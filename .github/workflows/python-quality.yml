name: Python CI tooling quality

on:
  pull_request:
    paths:
      - 'scripts/ci/**'
      - 'tests/ci/**'
      - 'pyproject.toml'
      - 'requirements-quality.txt'
      - '.github/workflows/python-quality.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ci/**'
      - 'tests/ci/**'
      - 'pyproject.toml'
      - 'requirements-quality.txt'
      - '.github/workflows/python-quality.yml'

permissions:
  contents: read

jobs:
  python-ci-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned quality tools
        run: python -m pip install --disable-pip-version-check -r requirements-quality.txt
      - name: Lint CI scripts and tests
        run: ruff check
      - name: Check formatting
        run: ruff format --check
      - name: Check types
        run: ty check
      - name: Exercise real Git and process behavior
        run: python -m unittest discover -s tests/ci -p 'test_*.py'
