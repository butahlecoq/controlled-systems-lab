      - 'tests/reporting/test_site_additions.py'
      - 'tests/reporting/test_app02_saved.py'
      - 'scripts/reports/stage_native_row_scaling_diagnostic.py'
      - 'tests/reporting/test_stage_native_row_scaling_diagnostic.py'
