permissions:
  contents: read

jobs:
  python-ci-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned quality tools
        run: python -m pip install --disable-pip-version-check -r requirements-quality.txt -r scripts/reports/requirements.txt -r benchmarks/reporting/closed_loop/requirements.txt
      - name: Lint selected maintained Python tooling
        run: ruff check
      - name: Check formatting
        run: ruff format --check
      - name: Check types
        run: ty check
      - name: Reject new prose comments in maintained tooling and CI tests
        env:
          COMMENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/ci/check_comment_ratchet.py check --base "$COMMENT_BASE"
      - name: Check closed-loop task and replay input shapes
        run: python -m unittest tests.reporting.test_closed_loop_tasks
      - name: Exercise real Git and process behavior
        run: python -m unittest discover -s tests/ci -p 'test_*.py'
      - name: Exercise site additions and the APP02 staging caller
        run: |
          python -m unittest discover -s tests/reporting -p 'test_site_additions.py'
          python -m unittest discover -s tests/reporting -p 'test_app02_saved.py'
          python -m unittest discover -s tests/reporting -p 'test_closed_loop_initial_baselines_publication.py'
      - name: Replay APP-03 and APP-04 saved reports and offline ZIPs
        run: |
          python -m unittest tests.reporting.test_app03_saved tests.reporting.test_app04_saved
          for app in app03 app04; do
            site="$RUNNER_TEMP/$app-saved-site"
            mkdir "$site"
            printf '<ul></ul>\n' > "$site/index.html"
            route=$(python "scripts/reports/stage_$app.py" --catalog "reports/algorithm-results/$app-publications.json" --site "$site")
            diff -r "reports/algorithm-results/$route" "$site/$route"
            if [ "$app" = app04 ]; then
              cmp "reports/algorithm-results/$route.zip" "$site/$route.zip"
            fi
          done
      - name: Check saved five-family fixed-tail geometry and episodes
        env:
          MPLBACKEND: Agg
        run: |
          python -m unittest tests.reporting.test_fixed_tail_example tests.reporting.test_native_fixed_tail_episode_report tests.reporting.test_native_fixed_tail_geometry
          python scripts/reports/native_fixed_tail_episode_report.py --out "$RUNNER_TEMP/fixed-tail-episode-site"
          python scripts/reports/native_fixed_tail_geometry.py --output "$RUNNER_TEMP/fixed-tail-geometry-site"
          cmp docs/examples/examples.css "$RUNNER_TEMP/fixed-tail-episode-site/examples/examples.css"
          cmp docs/examples/examples.css "$RUNNER_TEMP/fixed-tail-geometry-site/examples.css"
      - name: Replay the saved Volterra certificate and offline ZIP
        run: |
          python -m unittest tests.reporting.test_issue4_volterra_enclosure
          site="$RUNNER_TEMP/issue4-volterra-site"
          bundle=reports/algorithm-results/issue4-volterra-7dce05b47c50c27a
          mkdir "$site"
          printf '<ul></ul>\n' > "$site/index.html"
          python scripts/reports/stage_issue4_volterra.py --source "$bundle" --site "$site"
          diff -r "$bundle" "$site/${bundle##*/}"
      - name: Exercise the composed Pages route finalizer
        run: python -m unittest tests.reporting.test_pages_route_retirement
      - name: Exercise maintained compatibility entry points
        run: |
          python -m unittest discover -s tests/reporting -p 'test_syn03_strategy_a_report.py'
          python -m unittest discover -s tests/reporting -p 'test_syn03_ts02_report.py'
      - name: Check six saved environment routes and offline ZIPs
        run: >-
          python -m unittest
          tests.reporting.test_env717_publication
          tests.reporting.test_env717_two_points_publication
          tests.reporting.test_env717_unequal_game_publication
          tests.reporting.test_env717_max_coordinate_publication
          tests.reporting.test_env717_point_on_plane_publication
      - name: Check frozen Pages route preservation
        run: python -m unittest tests.reporting.test_preserve_published_routes tests.reporting.test_published_route_audit_policy
      - name: Exercise shared publication owners and malformed-input boundaries
        env:
          MPLBACKEND: Agg
        run: |
          python -m unittest tests.reporting.test_report_data tests.reporting.test_render tests.reporting.test_publication_policy tests.reporting.test_report_source_identity tests.reporting.test_registered_kinds tests.reporting.test_landing tests.reporting.test_learning_book tests.reporting.test_plot tests.reporting.test_b04_publication_source_snapshot tests.reporting.test_publication_spine_boundaries
      - name: Replay saved MPC replanning and output feedback
        run: |
          reports=reports/algorithm-results
          # Captured commits may be outside main history. Fetch them once for all replays.
          mpc04_commit=$(jq -er '.source.report_code_commit | select(test("^[a-f0-9]{40}$"))' "$reports/mpc04-max-coordinate-replanning-pilot-20261030/capture.json")
          mpc09_commit=$(jq -er '.source_commit | select(test("^[a-f0-9]{40}$"))' "$reports/mpc09-two-particle-output-feedback-v1/capture.json")
          missing=()
          for commit in "$mpc04_commit" "$mpc09_commit"; do
            if ! git cat-file -e "$commit^{commit}"; then
              missing+=("$commit")
            fi
          done
          if (( ${#missing[@]} )); then
            git fetch --no-tags --depth=1 origin "${missing[@]}"
          fi
          python -m unittest tests.reporting.test_mpc04_publication tests.reporting.test_mpc09_output_feedback_publication
          site=$(mktemp -d "$RUNNER_TEMP/mpc-replanning-feedback.XXXXXXXX")
          printf '<html><body><ul></ul></body></html>\n' > "$site/index.html"
          python scripts/reports/stage_mpc04_max_coordinate.py --source "$reports/mpc04-max-coordinate-replanning-pilot-20261030" --site "$site"
          python scripts/reports/stage_mpc09_output_feedback.py --source "$reports/mpc09-two-particle-output-feedback-v1" --site "$site"
          cd "$site"
          # Verify the published offline ZIPs, including compression and metadata.
          sha256sum --check <<'SHA256'
          ab5a12359f365d3044743dd9ad74d3ee6279e00f2d68895830c84f8ab59aa965  mpc04-max-coordinate-replanning-9737632b9802b7f5dc32.zip
          457cd203b245f8d7cfc26a8c3c464155cf20d5ed84e3e77ac04fd5b99079ba20  mpc09-output-feedback-62e43f8e4f58eda35210.zip
          SHA256
      - name: Check cumulative Pages artifact identity and output
        run: python -m unittest tests.reporting.test_pages_augmentation_waiter
      - name: Check ITIS17 saved hull reports and summary commands
        run: |
          python -m unittest tests.reporting.test_exp02_it17_dyadic_stage tests.reporting.test_exp02_it17_hull3d_publication tests.reporting.test_exp02_it17_hull4d_publication
          out=$(mktemp -d "$RUNNER_TEMP/it17-replay.XXXXXXXX")
          reports=reports/algorithm-results
          preliminary="$reports/quickhull-it17-paper-adaptations-20261024-r1"
          mkdir "$out/site"
          printf '<ul></ul>\n' > "$out/site/index.html"
          python scripts/reports/stage_it17_hull_adaptations.py --source "$preliminary" --site "$out/site"
          python benchmarks/reporting/it17_hull/summarize.py "$preliminary/raw-capture.jsonl" "$out/preliminary"
          for file in summary.csv index.html fixture-geometry.svg raw-rows.jsonl; do
            cmp "$preliminary/$file" "$out/preliminary/$file"
          done
          for dimension in 3d 4d; do
            source="$reports/exp02-it17-hull-$dimension-simplex-20261028-r1"
            python "benchmarks/reporting/it17_hull/summarize_$dimension.py" --raw "$source/raw/raw-rows.jsonl" --output-dir "$out/$dimension"
            for file in summary.csv index.html input-projections.svg validated-rows.jsonl; do
              cmp "$source/$file" "$out/$dimension/$file"
            done
          done
          ladder="$reports/exp02-it17-hull-ladder-20261024-r1"
          python scripts/reports/summarize_exp02_hull_ladder.py --raw-dir "$ladder/raw" --output-dir "$out/ladder"
          cmp "$ladder/coverage.json" "$out/ladder/coverage.json"
          cmp "$ladder/validated-rows.jsonl" "$out/ladder/validated-rows.jsonl"
          dyadic="$reports/exp02-it17-dyadic-250-20261029-r1"
          python scripts/reports/summarize_exp02_it17_250.py "$dyadic/raw/raw-rows.jsonl" "$out/dyadic"
          for file in summary.csv index.html fixture-geometry.svg raw/raw-rows.jsonl; do
            cmp "$dyadic/$file" "$out/dyadic/$file"
          done
      - name: Check mathematical presentation and frozen HTML
        run: python -m unittest tests.reporting.test_mathematical_presentation
      - name: Check required modules in the controller evidence runner
        run: python -m unittest tests.reporting.test_controller_publication_runner
      - name: Validate recorded control figures
        run: python -m unittest tests.reporting.test_recorded_closed_loop_figures tests.reporting.test_viz03_control_figures
      - name: Replay archived EXT-04 continuous, affine and H-domain policies
        env:
          MPLBACKEND: Agg
        run: |
          python -m unittest tests.reporting.test_ext04_affine_synthesis_publication
          results=reports/algorithm-results
          site=$(mktemp -d "$RUNNER_TEMP/ext04-policies.XXXXXXXX")
          printf '<html><body><ul></ul></body></html>\n' > "$site/index.html"
          for variant in continuous affine-synthesis h-policy; do
            catalog="$results/ext04-$variant-publications.json"
            report=$(jq -er '.reports[0].source_report_id' "$catalog")
            checksum=$(jq -er '.reports[0].zip_sha256' "$catalog")
            stager="scripts/reports/stage_ext04_${variant//-/_}.py"
            python "$stager" --source "$results/$report" > "$site/$variant.catalogue.json"
            cmp "$catalog" "$site/$variant.catalogue.json"
            python "$stager" --catalog "$catalog" --site "$site"
            printf '%s  %s\n' "$checksum" "$site/$report.zip" | sha256sum --check
          done
      - name: Exercise Pages deployment freshness and source identity
        run: python -m unittest tests.reporting.test_deploy_head
      - name: Check the frozen Buryatia reachability lessons
        run: python -m unittest tests.reporting.test_stage_buryatia_dim4 tests.reporting.test_stage_buryatia_volterra
      - name: Exercise saved publication and collector consumer families
        env:
          MPLBACKEND: Agg
        run: |
          python -m unittest tests.reporting.test_convex_report tests.reporting.test_opt07_collector tests.reporting.test_opt12_collector tests.reporting.test_visual_examples tests.reporting.test_geo07_publication tests.reporting.test_geo07_port_publication tests.reporting.test_geo07_dependent_publication tests.reporting.test_finite_feedback_publication tests.reporting.test_ext04_publication tests.reporting.test_report_lifecycle


      - name: Replay the saved closed-loop pilot and terminal-cost routes
        env:
          MPLBACKEND: Agg
        run: |
          python -m unittest tests.reporting.test_native_terminal_cost_publication
          site=$(mktemp -d "$RUNNER_TEMP/native-diagnostics.XXXXXXXX")
          mkdir "$site/examples"
          printf '<section id="analytic-illustrations"></section>\n' > "$site/examples/index.html"
          pilot=reports/closed-loop-pilot/closed-loop-pilot-v1
          cost=reports/algorithm-results/native-terminal-cost-33f907a0
          python - "$pilot.zip" <<'PY'
          import sys
          from zipfile import ZipFile

          with ZipFile(sys.argv[1]) as archive:
              damaged = archive.testzip()
              if damaged is not None:
                  raise ValueError(f"Damaged closed-loop archive member: {damaged}")
          PY
          python scripts/reports/native_terminal_cost_example.py --site "$site"
          python scripts/reports/stage_closed_loop_pilot.py --source "$pilot" --site "$site"
          for bundle in "$pilot" "$cost"; do
            route=${bundle##*/}
            diff -r "$bundle" "$site/$route"
            cmp "$bundle.zip" "$site/$route.zip"
          done
      - name: Check both saved Strategy A choice-pipeline publications
        env:
          MPLBACKEND: Agg
        run: python -m unittest tests.reporting.test_issue944_each_choice_publication tests.reporting.test_issue944_postfix_publication
      - name: Verify saved native model bundles and lesson links
        env:
          MPLBACKEND: Agg
        run: python -m unittest tests.reporting.test_native_discrete_models tests.reporting.test_stage_native_flexible_pitch
      - name: Check the locked source-only native row-scaling publication
        run: python -m unittest discover -s tests/reporting -p 'test_stage_native_row_scaling_diagnostic.py'
      - name: Replay the ten saved TwoPoints publications
        run: |
          # The full checkout includes evidence tags. Fetch the two retained
          # PR refs for the additional matched-profile source commits.
          git fetch --no-tags origin refs/pull/846/head refs/pull/849/head
          python -m unittest discover -s tests/reporting -p 'test_issue824_*_publication.py'
          site=$(mktemp -d "$RUNNER_TEMP/issue824-replay.XXXXXXXX")
          printf '<ul></ul>\n' > "$site/index.html"
          while read -r publisher suffix; do
            source="reports/algorithm-results/issue824-two-points-$suffix"
            route=$(python "scripts/reports/stage_issue824_$publisher.py" --source "$source" --site "$site")
            test "$route" = "${source##*/}"
            diff -r "$source" "$site/$route"
          done <<'ROUTES'
          zonotope zonotope-pilot-v2
          box_minimax box-pilot-v4
          zonotope_minimax zonotope-minimax-v1
          zonotope_minimax zonotope-minimax-v2
          ellipsoid_minimax ellipsoid-minimax-v1
          ellipsoid_minimax ellipsoid-minimax-v2
          nominal nominal-v1
          nominal nominal-v2
          matched_minimax matched-minimax-v1
          limited_minimax matched-minimax-resource-v1
          ROUTES
      - name: Check the frozen environment report routes and ZIPs
        run: python -m unittest tests.reporting.test_env717_stager_publication
      - name: Replay the saved causal-tree and tube MPC publications
        run: |
          # A separately installed mpc06 package must not shadow the saved tooling.
          pythonpath=$(mktemp -d "$RUNNER_TEMP/tube-pythonpath.XXXXXXXX")
          mkdir "$pythonpath/mpc06"
          touch "$pythonpath/mpc06/__init__.py"
          PYTHONPATH="$pythonpath" python -m unittest tests.reporting.test_mpc05_causal_tree_publication tests.reporting.test_mpc06_tube_publication tests.reporting.test_mpc06_route_policy_sources tests.reporting.test_mpc06_tube_objective tests.reporting.test_mpc06_tube_objective_pages_augmentation
          site=$(mktemp -d "$RUNNER_TEMP/causal-tube.XXXXXXXX")
          printf '<html><body><ul></ul></body></html>\n' > "$site/index.html"
          reports=reports/algorithm-results
          python scripts/reports/stage_mpc05_causal_tree.py --source "$reports/mpc05-causal-tree-pilot-v2" --site "$site"
          python scripts/reports/stage_mpc06_tube.py --source "$reports/mpc06-nilpotent-tube-pilot-v1" --site "$site"
          PYTHONPATH="$pythonpath" python scripts/reports/stage_mpc06_tube_objective.py --site "$site"

          python - "$site" <<'PYZIP'
          import hashlib
          import sys
          from pathlib import Path
          from zipfile import ZipFile

          site = Path(sys.argv[1])
          # SHA-256 of the published archives, independently reproduced at the base commit.
          archive_hashes = {
              "mpc05-causal-tree-b3806c9080aea34bf291": "3e37a022cccf75b4472f88e9248da64262fe3f5ba57a7d6f1455e96ce754f4e8",
              "mpc06-tube-405a8ac4eb2bea7ebec8": "5c1c55429d719a497770a732ae4a7110b583c74e7b0cbeaa2d62618515716b23",
              "mpc06-tube-cost-7e3fe044f4cecc83a90c": "02d6d5dfa6cd51038361916ae8cacb813da62e85fc7c72f9e61a509812070f64",
          }
          for route, expected_hash in archive_hashes.items():
              archive_path = site / f"{route}.zip"
              if hashlib.sha256(archive_path.read_bytes()).hexdigest() != expected_hash:
                  raise ValueError(f"Published archive checksum differs for {route}")
              members = {f"{route}/{path.name}": path for path in (site / route).iterdir()}
              with ZipFile(archive_path) as archive:
                  names = archive.namelist()
                  if len(names) != len(members) or set(names) != members.keys():
                      raise ValueError(f"Archive inventory differs for {route}")
                  for name, source in members.items():
                      if archive.read(name) != source.read_bytes():
                          raise ValueError(f"Archive differs from staged asset: {name}")
          PYZIP
      - name: Check native strategy starts, actuation and retry checkpoints
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m unittest tests.reporting.test_native_strategy_history tests.reporting.test_closed_loop_attempt_records
      - name: Exercise full-history validation, norms, and fixed-tail receipts
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: >-
          python -m unittest tests.reporting.test_history_geometry
          tests.reporting.test_history_norm_solver
          tests.reporting.test_native_fixed_tail_policy
          tests.reporting.test_nominal_tube_source
      - name: Check standalone closed-loop diagnostic imports
        run: python benchmarks/reporting/closed_loop/terminal_objective_probe.py --help
      - name: Check the saved native whole-history optimizer route
        run: python -m unittest discover -s tests/reporting -p 'test_history_optimizer_native.py'
      - name: Replay the saved MPC-03 and MPC-08 publications
        env:
          MPLBACKEND: Agg
        run: |
          python -m unittest tests.reporting.test_mpc08_publication
