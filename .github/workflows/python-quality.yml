          done
          python - "$reports" <<'PYZIP'
          import sys
          from pathlib import Path
          from zipfile import ZipFile

          reports = Path(sys.argv[1])
          for route in ("mpc08-explicit-pilot-v1", "mpc08-explicit-nonunique-v1"):
              bundle = reports / route
              members = {f"{route}/{path.name}": path for path in bundle.iterdir()}
              with ZipFile(bundle.with_suffix(".zip")) as archive:
                  names = archive.namelist()
                  if (len(names) != len(members) or set(names) != members.keys()
                          or archive.testzip() is not None):
                      raise ValueError(f"Invalid archive inventory or CRC for {route}")
                  for name, source in members.items():
                      if archive.read(name) != source.read_bytes():
                          raise ValueError(f"Archive differs from saved asset: {name}")
          PYZIP
          for route in mpc08-explicit-pilot-v1 mpc08-explicit-nonunique-v1; do
            cmp "$reports/$route.zip" "$site/$route.zip"
          done
