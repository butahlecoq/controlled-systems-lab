name: C++ core and nominal reachability tooling quality

on:
  pull_request:
    paths:
      - 'include/csl/core/**'
      - 'include/csl/evidence/**'
      - 'src/contracts/**'
      - 'include/csl/reachability/nominal_forward.hpp'
      - 'include/csl/reachability/nominal_predecessor.hpp'
      - 'include/csl/reachability/nominal_tube.hpp'
      - 'src/reachability/nominal_forward.cpp'
      - 'src/reachability/nominal_predecessor.cpp'
      - 'src/reachability/nominal_tube.cpp'
      - 'src/reachability/Module.cmake'
      - 'src/reachability/Tests.cmake'
      - 'src/geometry/Module.cmake'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.clang-format'
      - '.clang-tidy'
      - 'requirements-cpp-quality.txt'
      - 'scripts/ci/check_cpp_core.cmake'
      - '.github/workflows/cpp-core-quality.yml'
  push:
    branches: [main]
    paths:
      - 'include/csl/core/**'
      - 'include/csl/evidence/**'
      - 'src/contracts/**'
      - 'include/csl/reachability/nominal_forward.hpp'
      - 'include/csl/reachability/nominal_predecessor.hpp'
      - 'include/csl/reachability/nominal_tube.hpp'
      - 'src/reachability/nominal_forward.cpp'
      - 'src/reachability/nominal_predecessor.cpp'
      - 'src/reachability/nominal_tube.cpp'
      - 'src/reachability/Module.cmake'
      - 'src/reachability/Tests.cmake'
      - 'src/geometry/Module.cmake'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.clang-format'
      - '.clang-tidy'
      - 'requirements-cpp-quality.txt'
      - 'scripts/ci/check_cpp_core.cmake'
      - '.github/workflows/cpp-core-quality.yml'

permissions:
  contents: read

jobs:
  cpp-core-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned development tools
        run: python -m pip install --disable-pip-version-check -r requirements-cpp-quality.txt
      - name: Check core and nominal reachability formatting
        run: cmake -DCSL_CPP_QUALITY_MODE=format -P scripts/ci/check_cpp_core.cmake
      - name: Configure real C++20 compilation contexts
        run: >-
          cmake --preset core -B build/cpp-quality
          -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build selected modules and standalone headers
        run: >-
          cmake --build build/cpp-quality --parallel 1
          --target csl_contracts csl_core_header_checks csl_nominal_header_checks
          csl_nominal_forward csl_nominal_tube csl_polyhedral
          contract_tests public_client projection_predecessor_tests projection_predecessor_public_client
      - name: Analyze selected public headers and implementations
        run: cmake -DCSL_CPP_QUALITY_MODE=tidy -P scripts/ci/check_cpp_core.cmake
      - name: Exercise existing core and predecessor behavior
        run: >-
          ctest --test-dir build/cpp-quality --output-on-failure
          -R '^(contract_tests|public_client|projection_predecessor_tests|projection_predecessor_public_client)$'
