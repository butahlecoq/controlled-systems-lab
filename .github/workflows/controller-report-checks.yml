name: Controller report saved-evidence checks

on:
  pull_request:
    paths:
      - '.github/workflows/controller-report-checks.yml'
      - '.github/workflows/pages-augmentation-aggregation.yml'
      - 'benchmarks/reporting/mpc11/**'
      - 'benchmarks/reporting/closed_loop/**'
      - 'docs/contracts/closed-loop/**'
      - 'tests/reporting/test_closed_loop_tasks.py'
      - 'docs/research/evidence/b04-source-moment*'
      - 'docs/research/evidence/b04-source-moment-figures/**'
      - 'docs/research/tools/check_b04_source_moments.py'
      - 'tests/reporting/test_b04_source_moments.py'
      - 'tests/reporting/test_stage_b04_source_moments.py'
      - 'scripts/reports/**'
      - 'reports/algorithm-results/**'
      - 'tests/reporting/test_mpc11_affine_saved.py'
      - 'tests/reporting/test_mpc11_publication.py'
      - 'tests/reporting/test_pages_augmentation_aggregation.py'
      - 'tests/reporting/run_controller_publication_checks.py'
      - 'tests/reporting/test_controller_publication_runner.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/controller-report-checks.yml'
      - '.github/workflows/pages-augmentation-aggregation.yml'
      - 'benchmarks/reporting/mpc11/**'
      - 'benchmarks/reporting/closed_loop/**'
      - 'docs/contracts/closed-loop/**'
      - 'tests/reporting/test_closed_loop_tasks.py'
      - 'docs/research/evidence/b04-source-moment*'
      - 'docs/research/evidence/b04-source-moment-figures/**'
      - 'docs/research/tools/check_b04_source_moments.py'
      - 'tests/reporting/test_b04_source_moments.py'
      - 'tests/reporting/test_stage_b04_source_moments.py'
      - 'scripts/reports/**'
      - 'reports/algorithm-results/**'
      - 'tests/reporting/test_mpc11_affine_saved.py'
      - 'tests/reporting/test_mpc11_publication.py'
      - 'tests/reporting/test_pages_augmentation_aggregation.py'
      - 'tests/reporting/run_controller_publication_checks.py'
      - 'tests/reporting/test_controller_publication_runner.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  saved-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLCONFIGDIR: build/matplotlib-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.14'
          cache: pip
          cache-dependency-path: benchmarks/reporting/mpc11/environment/requirements-linux-cp311.lock
      - name: Install the qualified hash-locked report environment
        run: |
          python -m venv build/controller-report-env
          build/controller-report-env/bin/python -m pip download --only-binary=:all: --require-hashes -r benchmarks/reporting/mpc11/environment/requirements-linux-cp311.lock --dest build/controller-report-wheels
          build/controller-report-env/bin/python -m pip install --no-index --find-links build/controller-report-wheels --require-hashes -r benchmarks/reporting/mpc11/environment/requirements-linux-cp311.lock
          build/controller-report-env/bin/python -m pip check
      - name: Require actual controller dependencies before selecting full tests
        run: build/controller-report-env/bin/python -c 'import sys,numpy,scipy,casadi,do_mpc; assert sys.version_info[:3] == (3,11,14)'
      - name: Install the CMake version required by CSL
        run: python -m pip install cmake==3.31.6
      - name: Build the shared CSL nonlinear replay bridge
        run: |
          cmake -S benchmarks/reporting/mpc11 -B build/controller-replay-build \
            -DCSL_SOURCE_ROOT="$PWD" -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build build/controller-replay-build --target csl_mpc11_nonlinear_replay --parallel 2
      - name: Check source-bound closed-loop task replay
        run: |
          build/controller-report-env/bin/python benchmarks/reporting/closed_loop/validate_contracts.py
          build/controller-report-env/bin/python benchmarks/reporting/closed_loop/check_replay.py \
            --bridge build/controller-replay-build/csl_mpc11_nonlinear_replay
      - name: Recheck saved transcriptions and complete cumulative staging
        run: |
          set -o pipefail
          build/controller-report-env/bin/python -m tests.reporting.run_controller_publication_checks 2>&1 | tee build/controller-publication-checks.log
      - name: Retain current host checking diagnostics separately from Pages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: controller-publication-checks-${{ github.sha }}-${{ github.run_id }}
          path: build/controller-publication-checks.log
          if-no-files-found: ignore
          retention-days: 30
