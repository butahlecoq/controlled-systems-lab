name: Native C++20

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      clean:
        description: Disable archive/compiler cache restore and save for clean validation
        type: boolean
        default: false

permissions:
  contents: read

# A PR synchronization already validates its branch: do not also build pushes
# to feature branches. Keep every main/manual run; supersede only the same PR.
concurrency:
  group: native-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  route:
    uses: ./.github/workflows/validation-routing.yml

  release:
    needs: route
    if: needs.route.outputs.native == 'true'
    name: Release / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC x64
            os: windows-2022
            cc: cl
            cxx: cl
            generator: Visual Studio 17 2022
            configure: -G "Visual Studio 17 2022" -A x64
            buryatia_report: false
          - name: Linux GCC 13 x64
            os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
            generator: Ninja
            configure: -G Ninja
            buryatia_report: true
          - name: Linux Clang 18 x64
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            generator: Ninja
            configure: -G Ninja
            buryatia_report: false
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: ${{ matrix.buryatia_report && '0' || '1' }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned CMake tooling
        run: python -m pip install cmake==3.31.6
      - name: Restore compatible validation caches
        id: cache
        uses: ./.github/actions/native-cache-setup
        with:
          lane: release-${{ matrix.cc }}
          configuration: Release
          generator: ${{ matrix.generator }}
          options: ${{ matrix.configure }} -DCMAKE_BUILD_TYPE=Release -DCSL_DEPENDENCY_PROBES=ON -DCSL_BUILD_MPC06_REPORT=ON ${{ matrix.buryatia_report && '-DCSL_BUILD_BURYATIA_REPORT=ON' || '' }}
          clean: ${{ inputs.clean || false }}
      - name: Verify pinned archive reuse and corruption rejection
        run: python -m unittest discover -s tests/cmake -p 'test_dependency_archive.py'
      - name: Configure
        run: cmake -S . -B tmp/native ${{ matrix.configure }} -DCMAKE_BUILD_TYPE=Release -DCSL_DEPENDENCY_PROBES=ON -DCSL_BUILD_MPC06_REPORT=ON ${{ matrix.buryatia_report && '-DCSL_BUILD_BURYATIA_REPORT=ON' || '' }}
      - name: Build
        run: cmake --build tmp/native --config Release --parallel 4
      - name: Test source and installed clients plus literal numeric probes
        run: ctest --test-dir tmp/native -C Release --output-on-failure --no-tests=error
      - name: Install public package
        run: cmake --install tmp/native --config Release --prefix install
      - name: Preserve cache work evidence and permitted snapshots
        if: always() && steps.cache.outputs.archive_key != ''
        uses: ./.github/actions/native-cache-finish
        with:
          lane: release-${{ matrix.cc }}
          clean: ${{ inputs.clean || false }}
          build_success: ${{ job.status == 'success' }}
          archive_key: ${{ steps.cache.outputs.archive_key }}
          compiler_key: ${{ steps.cache.outputs.compiler_key }}
          compiler_enabled: ${{ steps.cache.outputs.compiler_enabled }}
          save_allowed: ${{ steps.cache.outputs.save_allowed }}
          archive_hit: ${{ steps.cache.outputs.archive_hit }}
          compiler_hit: ${{ steps.cache.outputs.compiler_hit }}

  sanitizers:
    needs: route
    if: needs.route.outputs.native == 'true'
    name: Linux GCC 13 / ASan and UBSan (public modules and consumers)
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==3.31.6
      - name: Restore instrumented validation caches
        id: cache
        uses: ./.github/actions/native-cache-setup
        with:
          lane: gcc-sanitizers
          configuration: Debug
          generator: Ninja
          options: >-
            -DCSL_DEPENDENCY_PROBES=OFF
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g1"
            -DCMAKE_CXX_FLAGS_DEBUG="-O0 -g1"
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          clean: ${{ inputs.clean || false }}
      - name: Configure instrumented public modules and consumers
        run: >-
          cmake -S . -B tmp/sanitizers -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCSL_DEPENDENCY_PROBES=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g1"
          -DCMAKE_CXX_FLAGS_DEBUG="-O0 -g1"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Record sanitizer runner disk before build
        run: |
          df -h "$GITHUB_WORKSPACE"
          du -sh .ci-cache/objects .ci-cache/archives 2>/dev/null || true
      - name: Build all sanitizer targets with minimal line-level debug info
        run: cmake --build tmp/sanitizers --parallel 4
      - name: Run all sanitizer tests
        run: ctest --test-dir tmp/sanitizers --output-on-failure --no-tests=error
      - name: Record sanitizer runner disk after build
        if: always()
        run: |
          df -h "$GITHUB_WORKSPACE"
          du -sh tmp/sanitizers .ci-cache/objects .ci-cache/archives 2>/dev/null || true
      - name: Preserve instrumented cache evidence and permitted snapshots
        if: always() && steps.cache.outputs.archive_key != ''
        uses: ./.github/actions/native-cache-finish
        with:
          lane: gcc-sanitizers
          clean: ${{ inputs.clean || false }}
          build_success: ${{ job.status == 'success' }}
          archive_key: ${{ steps.cache.outputs.archive_key }}
          compiler_key: ${{ steps.cache.outputs.compiler_key }}
          compiler_enabled: ${{ steps.cache.outputs.compiler_enabled }}
          save_allowed: ${{ steps.cache.outputs.save_allowed }}
          archive_hit: ${{ steps.cache.outputs.archive_hit }}
          compiler_hit: ${{ steps.cache.outputs.compiler_hit }}

  partial-package:
    needs: route
    if: needs.route.outputs.native == 'true'
    name: Linux GCC 13 / ${{ matrix.preset }} installed package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [core, highs]
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==3.31.6
      - name: Restore selected package validation caches
        id: cache
        uses: ./.github/actions/native-cache-setup
        with:
          lane: package-${{ matrix.preset }}
          configuration: Release
          generator: Ninja
          options: cmake --preset ${{ matrix.preset }} ${{ matrix.preset == 'core' && '-DCSL_BUILD_SYN07_REPORT=ON' || '' }}
          clean: ${{ inputs.clean || false }}
      - name: Configure selected package and backend-neutral report regression
        shell: bash
        run: |
          if [ '${{ matrix.preset }}' = core ]; then
            cmake --preset core -DCSL_BUILD_SYN07_REPORT=ON
          else
            cmake --preset highs
          fi
      - name: Disabled vendors were not acquired
        shell: bash
        run: |
          test ! -d build/${{ matrix.preset }}/_deps/csl_qhull-src
          if [ '${{ matrix.preset }}' = core ]; then
            test ! -d build/core/_deps/csl_highs-src
          fi
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}
      - name: Preserve package cache evidence and permitted snapshots
        if: always() && steps.cache.outputs.archive_key != ''
        uses: ./.github/actions/native-cache-finish
        with:
          lane: package-${{ matrix.preset }}
          clean: ${{ inputs.clean || false }}
          build_success: ${{ job.status == 'success' }}
          archive_key: ${{ steps.cache.outputs.archive_key }}
          compiler_key: ${{ steps.cache.outputs.compiler_key }}
          compiler_enabled: ${{ steps.cache.outputs.compiler_enabled }}
          save_allowed: ${{ steps.cache.outputs.save_allowed }}
          archive_hit: ${{ steps.cache.outputs.archive_hit }}
          compiler_hit: ${{ steps.cache.outputs.compiler_hit }}

  casadi-package:
    needs: route
    if: needs.route.outputs.native == 'true'
    name: Linux GCC 13 / native CasADi enabled SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: gcc-13
      CXX: g++-13
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare pinned native CasADi dependency and CMake
        run: |
          python -m pip install cmake==3.31.6 -r benchmarks/reporting/closed_loop/requirements.txt
          python - <<'PYTHON'
          import casadi, os
          from pathlib import Path
          prefix = Path(casadi.__file__).resolve().parent
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'CASADI_NATIVE_PREFIX={prefix}\nCASADI_CMAKE_DIR={prefix / "cmake"}\n')
          PYTHON
      - name: Restore compatible optional-native caches
        id: cache
        uses: ./.github/actions/native-cache-setup
        with:
          lane: casadi-package
          configuration: Release
          generator: Ninja
          options: -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCSL_ENABLE_CASADI=ON -DCSL_ENABLE_HIGHS=OFF -DCSL_ENABLE_QHULL=OFF
          clean: ${{ inputs.clean || false }}
      - name: Configure actual CasADi C++ adapter and ABI/link probes
        run: >-
          cmake -S . -B tmp/casadi-sdk -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          -DCSL_ENABLE_CASADI=ON -DCSL_ENABLE_HIGHS=OFF -DCSL_ENABLE_QHULL=OFF
          -Dcasadi_DIR="$CASADI_CMAKE_DIR"
      - name: Build native adapter and SDK serially
        run: cmake --build tmp/casadi-sdk --parallel 1
      - name: Install the enabled native SDK
        run: cmake --install tmp/casadi-sdk --prefix "$GITHUB_WORKSPACE/install/casadi"
      - name: Build and execute isolated installed consumers with an empty runtime PATH
        run: >-
          cmake -DCSL_SOURCE_DIR="$GITHUB_WORKSPACE"
          -DCSL_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/casadi"
          -DCSL_WORK_DIR="$GITHUB_WORKSPACE/tmp/casadi-consumers"
          -DCSL_CASADI_DIR="$CASADI_CMAKE_DIR"
          -P cmake/RunCasadiInstalledClient.cmake
      - name: Audit native executable and IPOPT plugin dependencies
        run: |
          ldd tmp/casadi-consumers/build/policy > tmp/casadi-consumer-dependencies.log
          ldd "$CASADI_NATIVE_PREFIX/libcasadi_nlpsol_ipopt.so" > tmp/casadi-ipopt-dependencies.log
          if grep -i libpython tmp/casadi-consumer-dependencies.log tmp/casadi-ipopt-dependencies.log; then
            exit 1
          fi
          if grep -F "$GITHUB_WORKSPACE" install/casadi/lib/cmake/CSL/CSLConfig.cmake install/casadi/lib/cmake/CSL/CSLTargets.cmake; then
            exit 1
          fi
      - name: Preserve optional-native cache evidence
        if: always() && steps.cache.outputs.archive_key != ''
        uses: ./.github/actions/native-cache-finish
        with:
          lane: casadi-package
          clean: ${{ inputs.clean || false }}
          build_success: ${{ job.status == 'success' }}
          archive_key: ${{ steps.cache.outputs.archive_key }}
          compiler_key: ${{ steps.cache.outputs.compiler_key }}
          compiler_enabled: ${{ steps.cache.outputs.compiler_enabled }}
          save_allowed: ${{ steps.cache.outputs.save_allowed }}
          archive_hit: ${{ steps.cache.outputs.archive_hit }}
          compiler_hit: ${{ steps.cache.outputs.compiler_hit }}
      - name: Retain native dependency and consumer validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: casadi-enabled-native-validation
          path: |
            tmp/casadi-sdk/CMakeCache.txt
            tmp/casadi-sdk/CMakeFiles/CMakeConfigureLog.yaml
            tmp/casadi-consumers/build/CMakeCache.txt
            tmp/casadi-*-dependencies.log
          retention-days: 14

  native-status:
    name: Native validation
    if: always()
    needs: [route, release, sanitizers, partial-package, casadi-package]
    runs-on: ubuntu-24.04
    steps:
      - name: Require routing and every requested native configuration
        env:
          ROUTE_RESULT: ${{ needs.route.result }}
          NATIVE: ${{ needs.route.outputs.native }}
          RELEASE_RESULT: ${{ needs.release.result }}
          SANITIZERS_RESULT: ${{ needs.sanitizers.result }}
          PACKAGE_RESULT: ${{ needs.partial-package.result }}
          CASADI_RESULT: ${{ needs.casadi-package.result }}
        run: |
          test "$ROUTE_RESULT" = success
          if [ "$NATIVE" = true ]; then
            test "$RELEASE_RESULT" = success
            test "$SANITIZERS_RESULT" = success
            test "$PACKAGE_RESULT" = success
            test "$CASADI_RESULT" = success
          else
            test "$NATIVE" = false
            echo 'Native inputs unchanged: native configurations intentionally not scheduled.'
          fi
