name: Native C++20

on:
  push:
    branches: [main]
    paths: ['**', '!**/*.md', '!reports/algorithm-results/**', 'reports/algorithm-results/tooling/**']
  pull_request:
    paths: ['**', '!**/*.md', '!reports/algorithm-results/**', 'reports/algorithm-results/tooling/**']
  workflow_dispatch:

permissions:
  contents: read

# A PR synchronization already validates its branch: do not also build pushes
# to feature branches. Keep every main/manual run; supersede only the same PR.
concurrency:
  group: native-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    name: Release / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC x64
            os: windows-2022
            cc: cl
            cxx: cl
            configure: -G "Visual Studio 17 2022" -A x64
          - name: Linux GCC 13 x64
            os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
            configure: -G Ninja
          - name: Linux Clang 18 x64
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            configure: -G Ninja
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned CMake tooling
        run: python -m pip install cmake==3.31.6
      - name: Configure
        run: cmake -S . -B tmp/native ${{ matrix.configure }} -DCMAKE_BUILD_TYPE=Release -DCSL_DEPENDENCY_PROBES=ON
      - name: Build
        run: cmake --build tmp/native --config Release --parallel 4
      - name: Test source and installed clients plus literal numeric probes
        run: ctest --test-dir tmp/native -C Release --output-on-failure --no-tests=error
      - name: Install public package
        run: cmake --install tmp/native --config Release --prefix install

  sanitizers:
    name: Linux GCC 13 / ASan and UBSan (public modules and consumers)
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==3.31.6
      - name: Configure instrumented public modules and consumers
        run: >-
          cmake -S . -B tmp/sanitizers -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCSL_DEPENDENCY_PROBES=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build tmp/sanitizers --parallel 4
      - run: ctest --test-dir tmp/sanitizers --output-on-failure --no-tests=error

  partial-package:
    name: Linux GCC 13 / ${{ matrix.preset }} installed package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [core, highs]
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==3.31.6
      - name: Configure selected package and backend-neutral report regression
        shell: bash
        run: |
          if [ '${{ matrix.preset }}' = core ]; then
            cmake --preset core -DCSL_BUILD_SYN07_REPORT=ON
          else
            cmake --preset highs
          fi
      - name: Disabled vendors were not acquired
        shell: bash
        run: |
          test ! -d build/${{ matrix.preset }}/_deps/csl_qhull-src
          if [ '${{ matrix.preset }}' = core ]; then
            test ! -d build/core/_deps/csl_highs-src
          fi
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}
