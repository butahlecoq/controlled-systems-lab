name: Algorithm report records and site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    uses: ./.github/workflows/validation-routing.yml

  validate:
    needs: route
    if: needs.route.outputs.reports == 'true'
    runs-on: ubuntu-24.04
    outputs:
      has_reports: ${{ steps.catalog.outputs.has_reports }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install report-only validation and plotting tools
        run: python -m pip install --cache-dir build/report-pip-cache -r scripts/reports/requirements.txt
      - name: Validate literal records, safe export and real pinned plotting pipeline
        env:
          MPLCONFIGDIR: ${{ github.workspace }}/build/report-mpl-config
        run: python -m unittest discover -s tests/reporting -p 'test_*.py'
      - name: Validate frozen issue 3 saved measurement and projections
        run: python scripts/reports/issue3/render_saved.py --bundle reports/algorithm-results/issue3-finite-catalogue-b4632ce76510aa4f --check
      - name: Build and smoke the APP-01 public plan-check driver
        if: needs.route.outputs.native == 'true'
        shell: bash
        run: |
          cmake -S . -B build/app01-report-ci -DBUILD_TESTING=OFF -DCSL_ENABLE_HIGHS=OFF -DCSL_ENABLE_QHULL=OFF -DCSL_BUILD_APP01_REPORT=ON
          cmake --build build/app01-report-ci --config Release --target csl_app01_plan_report --parallel 2
          build/app01-report-ci/csl_app01_plan_report 2 1 1 > build/app01-report-ci/smoke.jsonl
          PYTHONPATH=scripts/reports python -c 'from pathlib import Path; import stage_app01 as report; assert len(report.raw_projection(Path("build/app01-report-ci/smoke.jsonl").read_bytes(), 2, 1, 1)) == 3'
      - name: Check reviewed catalogue and stage only allowlisted files
        id: catalog
        shell: bash
        run: |
          if test -f reports/algorithm-results/catalog.json; then
            python scripts/reports/site.py --catalog reports/algorithm-results/catalog.json --check --out build/report-site
            if test -f reports/algorithm-results/syn06-publications.json; then
              python scripts/reports/stage_syn06.py --catalog reports/algorithm-results/syn06-publications.json --site build/report-site
            fi
            if test -f reports/algorithm-results/app01-publications.json; then
              python scripts/reports/stage_app01.py --catalog reports/algorithm-results/app01-publications.json --site build/report-site
            fi
            if test -f reports/algorithm-results/app02-publications.json; then
              python scripts/reports/stage_app02.py --catalog reports/algorithm-results/app02-publications.json --site build/report-site
            fi
            if test -f reports/algorithm-results/app03-publications.json; then
              python scripts/reports/stage_app03.py --catalog reports/algorithm-results/app03-publications.json --site build/report-site
            fi
            if test -f reports/algorithm-results/app04-publications.json; then
              python scripts/reports/stage_app04.py --catalog reports/algorithm-results/app04-publications.json --site build/report-site
            fi
            if test -f reports/algorithm-results/ext01-publications.json; then
              python scripts/reports/stage_ext01.py --catalog reports/algorithm-results/ext01-publications.json --site build/report-site
            fi
            if test -f reports/algorithm-results/ext04-publications.json; then
              python scripts/reports/stage_ext04.py --catalog reports/algorithm-results/ext04-publications.json --site build/report-site
            fi
            if test -f reports/algorithm-results/ext05-publications.json; then
              python scripts/reports/stage_ext05.py --catalog reports/algorithm-results/ext05-publications.json --site build/report-site
            fi
            if test -f reports/algorithm-results/ext07-publications.json; then
              python scripts/reports/stage_ext07.py --catalog reports/algorithm-results/ext07-publications.json --site build/report-site
            fi
            if test -f reports/algorithm-results/opt10-publications.json; then
              python scripts/reports/stage_opt10.py --catalog reports/algorithm-results/opt10-publications.json --site build/report-site
            fi
            if test -d reports/algorithm-results/issue4-volterra-7dce05b47c50c27a; then
              python scripts/reports/stage_issue4_volterra.py \
                --source reports/algorithm-results/issue4-volterra-7dce05b47c50c27a \
                --site build/report-site
            fi
            if test -d reports/algorithm-results/lotka-volterra-sampled-20261023; then
              python scripts/reports/stage_lotka_volterra_sampled.py \
                --source reports/algorithm-results/lotka-volterra-sampled-20261023 \
                --site build/report-site
            fi
            if test -f reports/algorithm-results/exp04-publications.json; then
              python scripts/reports/stage_exp04.py --catalog reports/algorithm-results/exp04-publications.json --site build/report-site
            fi
            if test -f reports/algorithm-results/geo07-publications.json; then
              python scripts/reports/stage_geo07.py --catalog reports/algorithm-results/geo07-publications.json --site build/report-site
            fi
            if test -f reports/algorithm-results/geo07-port-publications.json; then
              python scripts/reports/stage_geo07_port.py --catalog reports/algorithm-results/geo07-port-publications.json --site build/report-site
            fi
            if test -f reports/algorithm-results/geo07-dependent-publications.json; then
              python scripts/reports/stage_geo07_dependent.py --catalog reports/algorithm-results/geo07-dependent-publications.json --site build/report-site
            fi
            if test -f reports/algorithm-results/geo08-publications.json; then
              python scripts/reports/stage_geo08.py --catalog reports/algorithm-results/geo08-publications.json --site build/report-site
            fi
            if test -f reports/algorithm-results/finite-feedback-publications.json; then
              python scripts/reports/stage_finite_feedback.py --catalog reports/algorithm-results/finite-feedback-publications.json --site build/report-site
            fi
            if test -d reports/algorithm-results/perf03-ts01-single-process-correlation-20261014; then
              python scripts/reports/stage_perf03.py \
                --source reports/algorithm-results/perf03-ts01-single-process-correlation-20261014 \
                --site build/report-site
            fi
            echo 'has_reports=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No measured catalogue has been committed; publication remains pending.'
            echo 'has_reports=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Stage minimal 2D visual examples from reviewed saved results
        if: steps.catalog.outputs.has_reports == 'true'
        run: python scripts/reports/visual_examples.py --catalog reports/algorithm-results/catalog.json --site build/report-site
      - name: Render the readable archive landing page
        if: steps.catalog.outputs.has_reports == 'true'
        run: python scripts/reports/landing.py --site build/report-site
      - name: Upload reviewed static site on main only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.catalog.outputs.has_reports == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/report-site

  report-status:
    name: Reporting validation
    if: always()
    needs: [route, validate]
    runs-on: ubuntu-24.04
    steps:
      - name: Require routing and complete requested reporting validation
        env:
          ROUTE_RESULT: ${{ needs.route.result }}
          REPORTS: ${{ needs.route.outputs.reports }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          test "$ROUTE_RESULT" = success
          if [ "$REPORTS" = true ]; then
            test "$VALIDATE_RESULT" = success
          else
            test "$REPORTS" = false
          fi

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.validate.outputs.has_reports == 'true'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
      # Preserve reverse-finished validations; GitHub caps this queue at 100 pending jobs.
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0; root configures Pages first
      - name: Check that the staged report still belongs to current main
        id: head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/reports/check_deploy_head.py
      - name: Deploy reviewed reports
        if: steps.head.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
