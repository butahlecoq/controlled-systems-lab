name: MPC-06 online public-port checks
on:
  pull_request:
    paths:
      - 'benchmarks/reporting/mpc06_online/**'
      - 'scripts/reports/mpc06_online/**'
      - 'tests/reporting/test_mpc06_online.py'
      - '.github/workflows/mpc06-online-study.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
            configure: -G Ninja
            executable: build/mpc06-online/csl_mpc06_online
          - os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            configure: -G Ninja
            executable: build/mpc06-online/csl_mpc06_online
          - os: windows-2022
            cc: cl
            cxx: cl
            configure: -G "Visual Studio 17 2022" -A x64
            executable: build/mpc06-online/Release/csl_mpc06_online.exe
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==3.31.6
      - run: python -m unittest discover -s tests/reporting -p test_mpc06_online.py
      - name: Configure public target
        run: cmake -S benchmarks/reporting/mpc06_online -B build/mpc06-online ${{ matrix.configure }} -DCSL_SOURCE_ROOT=${{ github.workspace }} -DCMAKE_BUILD_TYPE=Release -DCSL_DEPENDENCY_PROBES=OFF -DCSL_ENABLE_QHULL=OFF
      - run: cmake --build build/mpc06-online --config Release --target csl_mpc06_online --parallel 2
      - name: Exercise actual native QPs and reject unsafe outer tube
        run: python scripts/reports/mpc06_online/smoke.py ${{ matrix.executable }}
