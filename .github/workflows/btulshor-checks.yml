name: BTULSHOR source compatibility

on:
  pull_request:
    paths:
      - '.github/workflows/btulshor-checks.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/csl/geometry/legacy_btulshor.hpp'
      - 'src/geometry/**'
      - 'src/hull/**'
      - 'src/adapters/**'
      - 'benchmarks/reporting/btulshor/**'
      - 'scripts/reports/btulshor/**'
      - 'docs/research/evidence/btulshor-*'
      - 'tests/reporting/*btulshor*'
  push:
    branches: [main]
    paths:
      - '.github/workflows/btulshor-checks.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/csl/geometry/legacy_btulshor.hpp'
      - 'src/geometry/**'
      - 'src/hull/**'
      - 'src/adapters/**'
      - 'benchmarks/reporting/btulshor/**'
      - 'scripts/reports/btulshor/**'
      - 'docs/research/evidence/btulshor-*'
      - 'tests/reporting/*btulshor*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned renderer dependencies
        run: python -m pip install -r scripts/reports/requirements.txt
      - name: Build the actual source comparison driver
        run: |
          cmake -S . -B build/btulshor-report-ci -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release \
            -DCSL_ENABLE_HIGHS=ON -DCSL_ENABLE_QHULL=OFF -DCSL_BUILD_BTULSHOR_REPORT=ON
          cmake --build build/btulshor-report-ci --config Release --target csl_btulshor_compare --parallel 2
      - name: Verify source fixtures and functional report contract
        run: ctest --test-dir build/btulshor-report-ci -C Release --output-on-failure -R '^btulshor_(source_differential|driver_contract)$'
