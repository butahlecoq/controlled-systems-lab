name: Complete Pages augmentation

on:
  workflow_run:
    workflows: [MPC-06 tube objective Pages augmentation]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  await:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      upstream_run_id: ${{ steps.wait.outputs.upstream_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Wait for every single-route deployment for this source revision
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          CHILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python scripts/reports/await_pages_augmentation_runs.py --timeout-seconds 3000

  deploy:
    needs: await
    if: needs.await.outputs.upstream_run_id != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download the complete reviewed Pages artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: github-pages
          run-id: ${{ needs.await.outputs.upstream_run_id }}
          github-token: ${{ github.token }}
          path: build/pages-download
      - name: Install pinned report rendering dependencies
        run: python -m pip install --requirement scripts/reports/requirements.txt
      - name: Stage and verify all Pages augmentations together
        run: >-
          python scripts/reports/augment_pages_bundle.py
          --download build/pages-download
          --site build/report-site
      - name: Check that the complete artifact still targets current main
        id: head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          PAGES_SOURCE_RUN_ID: ${{ needs.await.outputs.upstream_run_id }}
          PAGES_SITE_DIR: build/report-site
        run: python3 scripts/reports/check_deploy_head.py
      - name: Upload the complete augmented Pages site
        if: steps.head.outputs.current == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/report-site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.head.outputs.current == 'true'
      - name: Deploy the complete augmented report site
        if: steps.head.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
