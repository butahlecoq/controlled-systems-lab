name: Pinned SDK and research consumer
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - benchmarks/sdk-revision
      - benchmarks/CMakeLists.txt
      - benchmarks/reporting/exp824/**
      - scripts/reports/exp824/check_nominal.py
      - include/csl/**
      - src/**
      - tools/closed_loop_native_policy.cpp
      - .github/workflows/research-sdk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    uses: ./.github/workflows/validation-routing.yml

  research:
    needs: route
    if: needs.route.outputs.research_sdk == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read SDK revision
        id: pin
        run: |
          revision=$(cat benchmarks/sdk-revision)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: butahlecoq/csl-sdk
          ref: ${{ steps.pin.outputs.revision }}
          path: build/upstream
          persist-credentials: false
      - name: Check native sources and public headers against the SDK
        run: |
          git ls-tree -r HEAD -- include/csl src tools/closed_loop_native_policy.cpp | awk '!/\.cmake$/' > "$RUNNER_TEMP/research-tree"
          git -C build/upstream ls-tree -r HEAD -- include/csl src tools/closed_loop_native_policy.cpp | awk '!/\.cmake$/' > "$RUNNER_TEMP/sdk-tree"
          diff -u "$RUNNER_TEMP/sdk-tree" "$RUNNER_TEMP/research-tree"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==3.31.6
      - name: Build and install the pinned core SDK
        run: |
          cmake -S build/upstream -B build/sdk -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCSL_ENABLE_HIGHS=OFF -DCSL_ENABLE_QHULL=OFF
          cmake --build build/sdk --parallel 4
          cmake --install build/sdk --prefix "$RUNNER_TEMP/csl-sdk"
      - name: Build and check the independent research client
        run: |
          cmake -S benchmarks -B build/research -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/csl-sdk"
          cmake --build build/research --parallel 2
          ctest --test-dir build/research --output-on-failure --no-tests=error

  research-status:
    name: Research SDK validation
    if: always()
    needs: [route, research]
    runs-on: ubuntu-24.04
    steps:
      - name: Require SDK parity and consumer validation when its path scope changed
        env:
          ROUTE_RESULT: ${{ needs.route.result }}
          REQUIRED: ${{ needs.route.outputs.research_sdk }}
          RESEARCH_RESULT: ${{ needs.research.result }}
        run: |
          test "$ROUTE_RESULT" = success
          if [ "$REQUIRED" = true ]; then
            test "$RESEARCH_RESULT" = success
          else
            test "$RESEARCH_RESULT" = skipped
          fi
