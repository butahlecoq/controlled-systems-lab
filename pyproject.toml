[tool.ruff]
required-version = "==0.17.5"
target-version = "py311"
line-length = 100
include = ["scripts/ci/*.py", "tests/ci/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ty.environment]
python-version = "3.11"
extra-paths = ["scripts/ci"]

[tool.ty.src]
include = ["scripts/ci", "tests/ci"]

[tool.ty.terminal]
error-on-warning = true
